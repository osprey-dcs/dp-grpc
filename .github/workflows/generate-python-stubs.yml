name: Generate Python gRPC Stubs

on:
  push:
    tags:
      - "rel-*"
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Target dp-python-lib repo (owner/name)"
        required: false
        default: "osprey-dcs/dp-python-lib"
      target_branch:
        description: "Target branch in dp-python-lib"
        required: false
        default: "main"
      dry_run:
        description: "Generate and report only; do not push or open a PR"
        required: false
        type: boolean
        default: true

jobs:
  generate-python-stubs:
    runs-on: ubuntu-latest

    # inputs.* are only populated on workflow_dispatch; on a rel-* tag push they
    # are empty, so every reference needs a fallback.  Without one, actions/checkout
    # silently falls back to checking out this repo instead of dp-python-lib.
    env:
      TARGET_REPO: ${{ inputs.target_repo || 'osprey-dcs/dp-python-lib' }}
      TARGET_BRANCH: ${{ inputs.target_branch || 'main' }}
      # A dry run generates stubs and reports what would change, but never checks out
      # dp-python-lib, pushes, or opens a PR.  A rel-* tag push always syncs for real;
      # a manual dispatch defaults to a dry run and must opt in to writing.  Defined
      # once here because six separate step-level conditions would eventually drift,
      # and the failure mode of a drifted one is an unintended write to another repo.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

    steps:
      # -----------------------------
      # Checkout dp-grpc (this repo)
      # -----------------------------
      - name: Checkout dp-grpc
        # Actions are pinned to commit SHAs rather than floating major tags: this job
        # holds DP_BOT_TOKEN, a cross-repo write credential, so a compromised upstream tag
        # here would reach write access to dp-python-lib as well as this repo.
        # Dependabot (.github/dependabot.yml) keeps the pins current.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # -----------------------------
      # Python + gRPC tooling
      # -----------------------------
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        # Hash-locked (issue #158): mypy-protobuf runs as a protoc plugin in a job that later
        # holds DP_BOT_TOKEN, so the generators get the same standard as the SHA-pinned
        # actions.  The pins also fix the gencode versions stamped into the stubs, which
        # dp-python-lib's runtime minimums track; see tools/python-stubs-requirements.in
        # before changing them.
        run: |
          python -m pip install --require-hashes -r tools/python-stubs-requirements.txt

      # -----------------------------
      # Generate Python stubs
      # -----------------------------
      - name: Generate Python gRPC stubs
        run: |
          rm -rf out
          mkdir -p out/python
      
          python -m grpc_tools.protoc \
            -I src/main/proto \
            --python_out=out/python \
            --grpc_python_out=out/python \
            --mypy_out=out/python \
            --mypy_grpc_out=out/python \
            src/main/proto/*.proto

          # Fix absolute imports in all generated Python files, stubs included.  An unfixed
          # import in a .pyi fails nothing at runtime; the type checker just loses the types.
          find out/python \( -name "*_pb2*.py" -o -name "*_pb2*.pyi" \) -exec \
            sed -i 's/^import \(.*_pb2\) as/from . import \1 as/' {} \;

      # Fail closed on a silent loss of type information, before anything reaches
      # dp-python-lib.  The sed above only rewrites one import shape; a generator that emits
      # another (e.g. `from common_pb2 import ...`) would otherwise pass unnoticed.  Relative
      # imports and dotted well-known-type imports (`from google.protobuf import ...`) cannot
      # match the pattern.
      - name: Check generated imports and type stubs
        run: |
          set -euo pipefail
          FAILED=0

          if grep -rnE '^(import|from) [A-Za-z0-9_]+_pb2(_grpc)?\b' out/python; then
            echo "::error::Absolute import of a generated module survived the fixup (listed above)"
            FAILED=1
          fi

          shopt -s nullglob
          PY_FILES=(out/python/*.py)
          if [ ${#PY_FILES[@]} -eq 0 ]; then
            echo "::error::No .py files were generated"
            FAILED=1
          else
            for f in "${PY_FILES[@]}"; do
              if [ ! -f "${f}i" ]; then
                echo "::error::No type stub for $f (expected ${f}i)"
                FAILED=1
              fi
            done
          fi

          exit $FAILED

      - name: Debug generated Python output
        run: |
          echo "=== Generated files ==="
          ls -l out/python || true
          find out/python -type f || true

      # Kept on every run, dry or real.  On a dry run it lets dp-python-lib check its code
      # against the exact stubs a release would deliver before any sync PR exists; on a real
      # run it is the audit record of what was synced.
      - name: Upload generated Python stubs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-stubs
          path: out/python
          if-no-files-found: error

      # -----------------------------
      # Determine release vs dev mode
      # -----------------------------
      - name: Determine sync mode
        id: mode
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/rel-* ]]; then
            VERSION="${GITHUB_REF#refs/tags/rel-}"
            echo "release=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "release=false" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------------------------------------
      # Everything below writes to dp-python-lib and is skipped on a dry run.  The
      # checkout immediately below is the step that consumes DP_BOT_TOKEN, so a dry run
      # never puts the cross-repo credential on disk at all.
      # -----------------------------------------------------------------------------

      # -----------------------------
      # Checkout dp-python-lib
      # -----------------------------
      - name: Checkout dp-python-lib
        if: env.DRY_RUN != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.DP_BOT_TOKEN }}
          path: dp-python-lib

      # -----------------------------
      # Sync generated stubs
      # -----------------------------
      - name: Sync Python stubs into dp-python-lib
        if: env.DRY_RUN != 'true'
        run: |
          rm -rf dp-python-lib/src/dp_python_lib/grpc
          mkdir -p dp-python-lib/src/dp_python_lib/grpc
          cp -r out/python/* dp-python-lib/src/dp_python_lib/grpc/

      # No version bump step: dp-python-lib derives its version from its own git tag via
      # setuptools-scm (`dynamic = ["version"]` in its pyproject.toml), so there is no
      # literal `version = "..."` for this workflow to rewrite.  An earlier step tried
      # anyway, substituting on an unanchored `version\s*=\s*"[^"]+"`.  That pattern matched
      # the tail of ruff's `target-version = "py310"` and rewrote it to the release version,
      # after which ruff could not parse its own config and failed dp-python-lib's CI on
      # every release sync.  The two repos' versions still line up, but by release process
      # (dp-python-lib is tagged to match) rather than by anything this workflow edits.

      # -----------------------------
      # Commit + push
      # -----------------------------

      - name: Configure git identity
        if: env.DRY_RUN != 'true'
        run: |
          git config --global user.name "dp-grpc bot"
          git config --global user.email "dp-grpc-bot@users.noreply.github.com"

      - name: Commit changes
        if: env.DRY_RUN != 'true'
        run: |
          cd dp-python-lib
          BRANCH="grpc-sync-${{ github.run_id }}"
          git checkout -B "$BRANCH"
          git add src/dp_python_lib/grpc || true
          git commit -m "Sync Python gRPC stubs from dp-grpc${{ steps.mode.outputs.release == 'true' && format(' rel-{0}', steps.mode.outputs.version) || '' }}" || echo "No changes to commit"

      - name: Push branch
        if: env.DRY_RUN != 'true'
        run: |
          cd dp-python-lib
          git push origin HEAD

      # -----------------------------
      # Create PR (optional but recommended)
      # -----------------------------
      - name: Create pull request
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.DP_BOT_TOKEN }}
          IS_RELEASE: ${{ steps.mode.outputs.release }}
          SYNC_VERSION: ${{ steps.mode.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cd dp-python-lib
          BODY=$(cat <<BODY_EOF
          Automated sync of generated Python gRPC stubs from dp-grpc.

          Release: ${IS_RELEASE}
          Version: ${SYNC_VERSION:-dev}
          Source run: ${RUN_URL}
          BODY_EOF
          )
          gh pr create \
            --title "Sync Python gRPC stubs from dp-grpc" \
            --body "$BODY" \
            --base "${{ env.TARGET_BRANCH }}" \
            --head "$(git branch --show-current)" || echo "PR already exists"

      # -----------------------------
      # Dry run summary
      # -----------------------------
      - name: Report what a real run would sync
        if: env.DRY_RUN == 'true'
        run: |
          set -euo pipefail
          {
            echo "### Dry run — nothing was pushed"
            echo
            echo "Generated $(find out/python -name '*.py' | wc -l | tr -d ' ') Python modules and"
            echo "$(find out/python -name '*.pyi' | wc -l | tr -d ' ') type stubs that a real run would sync into"
            echo "\`${TARGET_REPO}\` on branch \`${TARGET_BRANCH}\`."
            echo
            echo "The same files are attached to this run as the \`python-stubs\` artifact."
            echo "Re-dispatch with \`dry_run: false\` to push a branch and open a PR."
            echo
            echo '```'
            find out/python -type f \( -name '*.py' -o -name '*.pyi' \) | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

