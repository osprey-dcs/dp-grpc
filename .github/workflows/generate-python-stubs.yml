name: Generate Python gRPC Stubs

on:
  push:
    tags:
      - "rel-*"
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Target dp-python-lib repo (owner/name)"
        required: false
        default: "osprey-dcs/dp-python-lib"
      target_branch:
        description: "Target branch in dp-python-lib"
        required: false
        default: "main"

jobs:
  generate-python-stubs:
    runs-on: ubuntu-latest

    # inputs.* are only populated on workflow_dispatch; on a rel-* tag push they
    # are empty, so every reference needs a fallback.  Without one, actions/checkout
    # silently falls back to checking out this repo instead of dp-python-lib.
    env:
      TARGET_REPO: ${{ inputs.target_repo || 'osprey-dcs/dp-python-lib' }}
      TARGET_BRANCH: ${{ inputs.target_branch || 'main' }}

    steps:
      # -----------------------------
      # Checkout dp-grpc (this repo)
      # -----------------------------
      - name: Checkout dp-grpc
        uses: actions/checkout@v4

      # -----------------------------
      # Python + gRPC tooling
      # -----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install grpcio grpcio-tools protobuf

      # -----------------------------
      # Generate Python stubs
      # -----------------------------
      - name: Generate Python gRPC stubs
        run: |
          rm -rf out
          mkdir -p out/python
      
          python -m grpc_tools.protoc \
            -I src/main/proto \
            --python_out=out/python \
            --grpc_python_out=out/python \
            src/main/proto/*.proto
      
          # Fix absolute imports in all generated Python files
          find out/python -name "*_pb2*.py" -exec \
            sed -i 's/^import \(.*_pb2\) as/from . import \1 as/' {} \;

      - name: Debug generated Python output
        run: |
          echo "=== Generated files ==="
          ls -l out/python || true
          find out/python -type f || true

      # -----------------------------
      # Determine release vs dev mode
      # -----------------------------
      - name: Determine sync mode
        id: mode
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/rel-* ]]; then
            VERSION="${GITHUB_REF#refs/tags/rel-}"
            echo "release=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "release=false" >> $GITHUB_OUTPUT
          fi

      # -----------------------------
      # Checkout dp-python-lib
      # -----------------------------
      - name: Checkout dp-python-lib
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.DP_BOT_TOKEN }}
          path: dp-python-lib

      # -----------------------------
      # Sync generated stubs
      # -----------------------------
      - name: Sync Python stubs into dp-python-lib
        run: |
          rm -rf dp-python-lib/src/dp_python_lib/grpc
          mkdir -p dp-python-lib/src/dp_python_lib/grpc
          cp -r out/python/* dp-python-lib/src/dp_python_lib/grpc/

      # -----------------------------
      # Bump version (release only)
      # -----------------------------
      - name: Update pyproject.toml version
        if: steps.mode.outputs.release == 'true'
        run: |
          cd dp-python-lib
          python - <<EOF
          from pathlib import Path
          import re

          path = Path("pyproject.toml")
          text = path.read_text()
          text = re.sub(
              r'version\\s*=\\s*"[^"]+"',
              'version = "${{ steps.mode.outputs.version }}"',
              text,
          )
          path.write_text(text)
          EOF

      # -----------------------------
      # Commit + push
      # -----------------------------

      - name: Configure git identity
        run: |
          git config --global user.name "dp-grpc bot"
          git config --global user.email "dp-grpc-bot@users.noreply.github.com"

      - name: Commit changes
        run: |
          cd dp-python-lib
          BRANCH="grpc-sync-${{ github.run_id }}"
          git checkout -B "$BRANCH"
          git add src/dp_python_lib/grpc pyproject.toml || true
          git commit -m "Sync Python gRPC stubs from dp-grpc${{ steps.mode.outputs.release == 'true' && format(' rel-{0}', steps.mode.outputs.version) || '' }}" || echo "No changes to commit"

      - name: Push branch
        run: |
          cd dp-python-lib
          git push origin HEAD

      # -----------------------------
      # Create PR (optional but recommended)
      # -----------------------------
      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.DP_BOT_TOKEN }}
          IS_RELEASE: ${{ steps.mode.outputs.release }}
          SYNC_VERSION: ${{ steps.mode.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cd dp-python-lib
          BODY=$(cat <<BODY_EOF
          Automated sync of generated Python gRPC stubs from dp-grpc.

          Release: ${IS_RELEASE}
          Version: ${SYNC_VERSION:-dev}
          Source run: ${RUN_URL}
          BODY_EOF
          )
          gh pr create \
            --title "Sync Python gRPC stubs from dp-grpc" \
            --body "$BODY" \
            --base "${{ env.TARGET_BRANCH }}" \
            --head "$(git branch --show-current)" || echo "PR already exists"

