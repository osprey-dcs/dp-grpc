name: Release dp-grpc

on:
  push:
    tags:
      - 'rel-*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Actions are pinned to commit SHAs rather than floating major tags: this job runs
      # with `contents: write` and publishes release artifacts, so a compromised upstream
      # tag here could replace what users download.  Dependabot (.github/dependabot.yml)
      # keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build
        run: mvn -B package

      - name: Extract version
        run: echo "VERSION=${GITHUB_REF_NAME#rel-}" >> $GITHUB_ENV

      - name: Prepare artifacts
        run: |
          set -e
          mkdir -p release
          cp -r src/main/proto release/proto

          JAR=$(ls target/*.jar | head -n 1)
          cp "$JAR" release/dp-grpc-${VERSION}.jar

      - name: Package proto files
        run: |
          cd release
          tar czf dp-grpc-${VERSION}.tar.gz proto

      - name: Verify release artifacts exist
        run: |
          test -f release/dp-grpc-${VERSION}.tar.gz
          test -f release/dp-grpc-${VERSION}.jar

      - name: Generate checksums
        run: |
          sha256sum release/dp-grpc-${VERSION}.jar \
            > release/dp-grpc-${VERSION}.jar.sha256
          sha256sum release/dp-grpc-${VERSION}.tar.gz \
            > release/dp-grpc-${VERSION}.tar.gz.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release/dp-grpc-${{ env.VERSION }}.jar
            release/dp-grpc-${{ env.VERSION }}.jar.sha256
            release/dp-grpc-${{ env.VERSION }}.tar.gz
            release/dp-grpc-${{ env.VERSION }}.tar.gz.sha256
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
