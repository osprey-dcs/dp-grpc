//
// common.proto
//
// Contains RPC messages common to all services.

syntax = "proto3";

package dp.service.common;

option java_multiple_files = true;
option java_package = "com.ospreydcs.dp.grpc.v1.common";


//
// ------------------- Miscellaneous Definitions ---------------------------
//

/*
 * Generic key/value attribute, used as metadata to describe other objects.
 */
message Attribute {
  string name = 1;
  string value = 2;
}

/*
 * ColumnProvenance
 *
 * Describes the provenance of a data column.  Provenance is recorded at two levels of
 * detail, and this message is the finer of the two:
 *
 *   - Free-form description: "source" identifies the origin of the data (e.g., an
 *     NTTable/column identifier), and "process" describes any processing applied to the
 *     source data (e.g., normalization).  These fields are unconstrained and
 *     facility-specific.
 *   - Structured links: "derivedFrom" names the specific archived PVs and/or Calculations
 *     columns this column was computed from, in a form a client can traverse.
 *
 * The two are complementary and both are retained — human description and
 * machine-traversable link are different jobs.  The MLDP does not constrain, enforce,
 * interpret, or validate any of these values; derivedFrom links are stored as supplied and
 * are never checked for existence.  Clients should omit unset provenance fields rather
 * than sending empty string values.
 *
 * ColumnProvenance rides inside ColumnMetadata, which every column message type carries,
 * so one mechanism serves both Annotation Calculations columns and ingestion-side derived
 * data.  There is no wire or memory cost when unused: an absent ColumnMetadata or
 * ColumnProvenance and an empty derivedFrom list all encode to zero bytes.
 *
 * Document-level provenance is the coarser level and lives elsewhere: an Annotation's
 * dataSetIds and annotationIds (see annotation.proto).  Rule of thumb for placement of
 * derived data: one-time analysis products belong in Annotation Calculations, atomic with
 * their descriptive context and outside the PV namespace; continuously-computed derived
 * streams belong in ingestion as ordinary PVs.  Both use the derivedFrom links below.
 */
message ColumnProvenance {

  string source = 1;  // optional free-form description of the origin of the data
  string process = 2; // optional free-form description of processing applied to the source data

  /*
   * derivedFrom: optional structured links to the column(s) this column was derived from.
   *
   * Repeated because a derived column may have multiple inputs (e.g., a difference of two
   * PVs).  An empty list carries no assertion — it means provenance links were not
   * supplied, not that the column is un-derived.
   *
   * Links are soft associations and MAY DANGLE: a link that resolves to nothing means the
   * referenced record was deleted, and readers must tolerate it.  Deleting an Annotation
   * deletes its Calculations with it, so links into a deleted Annotation's calculations
   * dangle by the same rule.
   */
  repeated ColumnSource derivedFrom = 3;

  /*
   * ColumnSource
   *
   * Identifies one input to a derived column: either an archived PV or a column of a
   * Calculations object.
   */
  message ColumnSource {

    /*
     * origin: identifies the source column.  Exactly one arm should be set.
     *
     * Named "origin" rather than "source" because ColumnProvenance already has a string
     * field named source; a nested oneof of the same name would yield a confusing
     * getSource() / getOriginCase() pair in the generated Java.
     */
    oneof origin {
      string pvName = 1; // archived PV time-series data, by canonical PV name
      CalculationsColumn calculationsColumn = 2; // a column of a Calculations object
    }

    /*
     * timeRange: optional interval of the source consumed to produce this column.
     *
     * Matters for aggregations, whose source interval is not implied by the derived
     * column's own timestamps — a daily-mean sample at midnight consumes the preceding
     * day.  Omit when the derived column's own timestamps already describe the interval.
     */
    TimeRange timeRange = 3;
  }

  /*
   * CalculationsColumn
   *
   * Addresses a single column within a Calculations object.  Calculations are addressed by
   * calculationsId — the same key CalculationsSpec uses, the same key queryAnnotations
   * returns, and the key accepted by DpAnnotationService.getCalculations() — so a link
   * resolves in a single hop without loading the owning Annotation's descriptive payload.
   */
  message CalculationsColumn {
    string calculationsId = 1; // id of the Calculations object containing the column
    string frameName = 2; // name of the CalculationsDataFrame within that object
    string columnName = 3; // name of the column within that data frame
  }
}

/*
 * ColumnMetadata
 *
 * Wrapper for optional column-level metadata included with an ingestion request.
 * Includes provenance information, a list of string tags, and a list of key-value attributes.
 * Overuse of per-request column metadata will burden the ingestion server process, which is
 * optimized for continually ingesting PV time-series data.
 */
message ColumnMetadata {
  ColumnProvenance provenance = 1;
  repeated string tags = 2;
  repeated Attribute attributes = 3;
}

/*
 * PvMetadata
 *
 * Canonical metadata record for a process variable (PV).  PV name is the
 * primary identifier — no pre-registration of PVs is required before
 * ingestion.
 *
 * Placed in common.proto so it can be referenced by any service (annotation,
 * query, etc.) without introducing cross-service import cycles.
 *
 * createdTime / updatedTime are included because they are often useful to API
 * consumers for synchronization, auditing, cache invalidation, operational
 * visibility, and UI display.
 *
 * modifiedBy is an unvalidated free-form string identifying the actor (user,
 * service, or system) that performed the most recent save.  It reflects only
 * the last writer; no history is maintained.
 */
message PvMetadata {
  string pvName = 1; // canonical PV name
  repeated string aliases = 2; // optional historical / alternate names
  repeated string tags = 3; // optional keyword tags (normalized to lowercase unique set)
  repeated Attribute attributes = 4; // optional key/value attribute pairs
  Timestamp createdTime = 5; // time the record was first created
  Timestamp updatedTime = 6; // time the record was most recently saved
  string modifiedBy = 7; // optional actor / user / service identity for last save
  string description = 8; // optional free-text description
}

/*
 * Configuration
 *
 * Reusable machine configuration definition. configurationName is the canonical
 * identifier — no pre-registration is required.
 *
 * Placed in common.proto so it can be referenced by any service (annotation,
 * query, etc.) without introducing cross-service import cycles.
 *
 * createdTime / updatedTime are server-set audit timestamps.
 *
 * modifiedBy is an unvalidated free-form string identifying the actor (user,
 * service, or system) that performed the most recent save.  It reflects only
 * the last writer; no history is maintained.
 */
message Configuration {

  string configurationName = 1;       // canonical identifier (required)
  string category = 2;                // required
  string description = 3;             // optional free-text description
  string parentConfigurationName = 4; // optional parent configuration name
  repeated string tags = 5;           // optional keyword tags (normalized to lowercase unique set)
  repeated Attribute attributes = 6;  // optional key/value attribute pairs
  Timestamp createdTime = 7;          // server-set: time record was first created
  Timestamp updatedTime = 8;          // server-set: time record was most recently saved
  string modifiedBy = 9;              // optional actor / user / service identity for last save
}

/*
 * ConfigurationActivation
 *
 * Represents the time interval during which a Configuration was active.
 * startTime is required; endTime is optional (absent = open-ended interval).
 *
 * clientActivationId is an optional client-supplied stable identifier (e.g., a
 * calendar event ID).  If omitted, the server generates an opaque identifier.
 * Clients loading activations from external systems should always supply
 * clientActivationId to enable future updates without a prior lookup.
 *
 * Placed in common.proto so it can be referenced by any service (annotation,
 * query, etc.) without introducing cross-service import cycles.
 *
 * createdTime / updatedTime are server-set audit timestamps.
 *
 * modifiedBy is an unvalidated free-form string identifying the actor (user,
 * service, or system) that performed the most recent save.  It reflects only
 * the last writer; no history is maintained.
 */
message ConfigurationActivation {

  string clientActivationId = 1;      // optional client-supplied primary key; server-generated if absent
  string configurationName = 2;       // required; references a Configuration record
  Timestamp startTime = 3;            // required
  Timestamp endTime = 4;              // optional; absent = open-ended interval
  string description = 5;             // optional free-text description
  repeated string tags = 6;           // optional keyword tags (normalized to lowercase unique set)
  repeated Attribute attributes = 7;  // optional key/value attribute pairs
  Timestamp createdTime = 8;          // server-set: time record was first created
  Timestamp updatedTime = 9;          // server-set: time record was most recently saved
  string modifiedBy = 10;             // optional actor / user / service identity for last save
}

//
// ------------------- Time Definitions ---------------------------
//

/*
 * Time instant containing fields for seconds since epoch and nanoseconds offset.
 */
message Timestamp {
  uint64 epochSeconds = 1;  // Seconds past unix epoch - 1st january 1970.
  uint64 nanoseconds = 2;   // Nanoseconds - sub-second precision down to the nanosecond.
}

/*
 * Ordered list of Timestamp messages.
 */
message TimestampList {
  repeated Timestamp timestamps = 1;
}

/*
 * Collection of timestamps identified by sampling interval.
 *
 * Uniform sampling is assumed within sampling interval.
 * Thus, the ordered collection of timestamps are defined as a contiguous, equally-spaced point set
 * {t1, t2, ..., tN} within the following interval:
 *
 *    [startTime, (count-1)*periodNanos]
 *
 * The timestamps {t1, t2, ..., tN} are then given by
 *
 *    t1 = startTime,
 *    t2 = startTime + 1 * periodNanos,
 *    t3 = startTime + 2 * periodNanos,
 *    ...
 *    tN = startTime + (N-1) * periodNanos,
 *
 * where N = count.
 */
message SamplingClock {
  Timestamp startTime = 1; // Interval start time.
  uint64 periodNanos = 2; // Period in nanos between samples.
  uint32 count = 3; // Number of samples contained in the interval.
}

/*
 * Specifies the set of timestamps for ingested data, either using an explicit list of timestamps, or a
 * Sampling Clock specifying interval start time, sampling period, and sample count.
 */
message DataTimestamps {

  oneof value {
    SamplingClock samplingClock = 1;
    TimestampList timestampList = 2;
  }
}

/*
 * TimeRange
 *
 * Specifies a time interval over which data should be retrieved.  Placed in
 * common.proto because intervals are referenced across query and other use
 * cases.
 *
 * Interval semantics are half-open [beginTime, endTime) at the sample axis,
 * matching the MLDP bucket query engine.  Bucket selection is an interval-overlap
 * test: a bucket is selected iff
 *
 *   bucket.firstTime <  endTime   AND   bucket.lastTime >= beginTime
 *
 * so a selected boundary bucket may contain individual samples outside
 * [beginTime, endTime).  How those edge samples are handled differs by query
 * method (bucket queries return boundary buckets whole; sample queries trim to
 * the range).
 */
message TimeRange {
  Timestamp beginTime = 1; // Required, inclusive start of interval.
  Timestamp endTime = 2;   // Required, exclusive end of interval.
}


//
// ------------------- Common Result Definitions ---------------------------
//

/*
 * Exceptional Method Result.
 *
 * Used to describe an exceptional result from a service method, such as a rejection or error handling request.
 * This message is used by all service RPC methods to indicate a problem executing the method.
 */
message ExceptionalResult {

  ExceptionalResultStatus exceptionalResultStatus = 1; // Enum indicating the type of exceptional result.
  string message = 2; // Message with details about the exceptional result.

  enum ExceptionalResultStatus {
    RESULT_STATUS_REJECT = 0; // Indicates request was rejected during validation.
    RESULT_STATUS_ERROR = 1; // Indicates an error was encountered in handling the request.
    RESULT_STATUS_NOT_READY = 2; // Indicates an invalid bidirectional stream query cursor operation request.
  }
}


// ------------------- Heterogeneous Column Data Types  ---------------------------
//

/*
 * DoubleColumn
 *
 * Used to contain a vector of double data values. Individual data values are visible in the database.
 */
message DoubleColumn {
  string name = 1; // PV name
  repeated double values = 2 [packed = true];
  ColumnMetadata metadata = 10; // optional
}

/*
 * FloatColumn
 *
 * Used to contain a vector of float data values. Individual data values are visible in the database.
 */
message FloatColumn {
  string name = 1; // PV name
  repeated float values = 2 [packed = true];
  ColumnMetadata metadata = 10; // optional
}

/*
 * Int64Column
 *
 * Used to contain a vector of long data values. Individual data values are visible in the database.
 */
message Int64Column {
  string name = 1; // PV name
  repeated sint64 values = 2 [packed = true];
  ColumnMetadata metadata = 10; // optional
}

/*
 * Int32Column
 *
 * Used to contain a vector of int data values. Individual data values are visible in the database.
 */
message Int32Column {
  string name = 1; // PV name
  repeated sint32 values = 2 [packed = true];
  ColumnMetadata metadata = 10; // optional
}

/*
 * BoolColumn
 *
 * Used to contain a vector of boolean data values. Individual data values are visible in the database.
 */
message BoolColumn {
  string name = 1; // PV name
  repeated bool values = 2 [packed = true];
  ColumnMetadata metadata = 10; // optional
}

/*
 * StringColumn
 *
 * Used to contain a vector of string data values. Individual data values are visible in the database.
 *
 * It is encouraged to consider the use of alternatives like EnumColumn for memory and storage efficiency reasons.
 */
message StringColumn {
  string name = 1; // PV name
  repeated string values = 2;
  ColumnMetadata metadata = 10; // optional
}

/*
 * EnumColumn
 *
 * Used to contain a vector of int enum data values. Individual data values are visible in the database.
 *
 * The enumId is user-defined and not validated by the MLDP, and is contract between data producers and consumers.
 */
message EnumColumn {
  string name = 1; // PV name
  repeated int32 values = 2 [packed = true];
  string enumId = 3; // identifier for enum semantics, e.g. "epics:alarm_status:v2"
  ColumnMetadata metadata = 10; // optional
}

/*
 * ArrayDimensions
 *
 * Specifies the dimensions for a column whose sample values are arrays.  Dimensions are a list of values for each
 * dimension up to 3.
 */
message ArrayDimensions {
  repeated uint32 dims = 1; // e.g. [1024] or [64, 64] or [32, 32, 16]
}

/*
 * DoubleArrayColumn
 *
 * Used to contain a vector of arrays of doubles, each of the specified dimensions.
 * Data values are stored in the database as an opaque blob.
 */
message DoubleArrayColumn {
  string name = 1; // PV name
  ArrayDimensions dimensions = 2;
  // Flattened: sample_count × product(dims)
  repeated double values = 3 [packed = true];
  ColumnMetadata metadata = 10; // optional
}

/*
 * FloatArrayColumn
 *
 * Used to contain a vector of arrays of floats, each of the specified dimensions.
 * Data values are stored in the database as an opaque blob.
 */
message FloatArrayColumn {
  string name = 1;
  ArrayDimensions dimensions = 2;
  repeated float values = 3 [packed = true];
  ColumnMetadata metadata = 10; // optional
}

/*
 * Int64ArrayColumn
 *
 * Used to contain a vector of arrays of longs, each of the specified dimensions.
 * Data values are stored in the database as an opaque blob.
 */
message Int64ArrayColumn {
  string name = 1;
  ArrayDimensions dimensions = 2;
  repeated sint64 values = 3 [packed = true];
  ColumnMetadata metadata = 10; // optional
}

/*
 * Int32ArrayColumn
 *
 * Used to contain a vector of arrays of ints, each of the specified dimensions.
 * Data values are stored in the database as an opaque blob.
 */
message Int32ArrayColumn {
  string name = 1;
  ArrayDimensions dimensions = 2;
  repeated sint32 values = 3 [packed = true];
  ColumnMetadata metadata = 10; // optional
}

/*
 * BoolArrayColumn
 *
 * Used to contain a vector of arrays of booleans, each of the specified dimensions.
 * Data values are stored in the database as an opaque blob.
 */
message BoolArrayColumn {
  string name = 1;
  ArrayDimensions dimensions = 2;
  repeated bool values = 3 [packed = true];
  ColumnMetadata metadata = 10; // optional
}

/*
 * ImageDescriptor
 *
 * Specifies the details for an image including width, height, number of channels, and a user-defined encoding specifying
 * the image format that a contract between data producer and consumer.
 */
message ImageDescriptor {
  uint32 width = 1;
  uint32 height = 2;
  uint32 channels = 3; // e.g. 1 (mono), 3 (RGB)
  string encoding = 4; // e.g. "raw", "png", "jpeg"
}

/*
 * ImageColumn
 *
 * Used to contain a vector of image data values. Each image is a byte string, encoded according to imageDescriptor.
 * Data values are stored in the database as an opaque blob.
 */
message ImageColumn {
  string name = 1;
  ImageDescriptor imageDescriptor = 2;
  // One image per sample
  repeated bytes images = 3;
  ColumnMetadata metadata = 10; // optional
}

/*
 * StructColumn
 *
 * Used to contain a vector of structure data values. Each structure's content is serialized to byte string format.
 * The user-defined schemaId specifies the encoding for the structure, and is a contract between data producer and
 * consumer.
 */
message StructColumn {
  string name = 1;
  string schemaId = 2; // e.g. "beam_position:v3"
  // One struct per sample
  repeated bytes values = 3;
  ColumnMetadata metadata = 10; // optional
}

/*
 * SerializedDataColumn
 *
 * This "catch all" column contains the entire vector of data values as a single byte string. The user-defined
 * encoding specifies the format of the byte content, and is a contract between data producer and consumer.
 */
message SerializedDataColumn {
  string name = 1;
  string encoding = 2; // e.g. "Image:v1", "Struct:BeamPosition:v2", "proto:Image".
  bytes payload = 3;
  ColumnMetadata metadata = 10; // optional
}

/*
 * Data Column
 *
 * Contains a named vector of heterogeneous data values sampled for a particular PV.
 *
 * NOTE: Use of this type for ingestion is deprecated, and may be removed in the next API version. Handling of
 * DataColumns in ingestion causes per-sample memory allocation that is inefficient. Data values are stored in the
 * database as a single opaque blob, even for scalar-valued columns. Consider using one of the above column-oriented
 * data structures for ingestion efficiency.
 *
 * This deprecation applies to ingestion only. DataColumn remains the supported representation for tabular/sample
 * query results (e.g. the Query V2 ColumnTable), where an unset DataValue value oneof provides native
 * missing-value support that the dense column-oriented types do not.
 *
 * In Annotation Calculations, DataColumn is reachable through DataFrame.dataColumns and serves as an escape
 * hatch rather than the default: prefer the typed column-oriented types for calculation output, and reach for
 * DataColumn when a column is heterogeneously typed or has missing values at some timestamps.  A sparse
 * calculation does not need DataColumn — give it its own CalculationsDataFrame with its own (sparse) time axis,
 * on which its typed columns are dense.  Data frames are cheap.
 *
 */
message DataColumn {
  string name = 1; // Name of PV.
  repeated DataValue dataValues = 2; // List of heterogeneous column data values.
  ColumnMetadata metadata = 10; // optional
}

/*
 * Unit of Heterogeneous Data
 *
 * The message includes both a data field 'value' and a status field 'valueStatus'.
 * The 'value' field is the actual data value while the 'valueStatus' field represents the
 * condition of the value (i.e., typically at acquisition time).  Future versions may include
 * the status of the value within the archive (e.g., corrupt, truncated, etc.).
 *
 * The field 'value' is a union of all possible data types currently supported.  It represents one
 * unit of heterogeneous data.  Only one data type may be included in the message.
 *
 * The 'valueStatus' field is structure defined as an enclosed RPC message.  It contains information about the
 * value during acquisition, such as value alarm conditions, acquisition conditions, and any associated
 * message.  This field is subject to future modification for expanded use cases.
 *
 * NOTE: Use of this type for ingestion is deprecated, and may be removed in the next API version. Handling of
 * DataValue in ingestion causes per-sample memory allocation that is inefficient. Also, the ValueStatus mechanism
 * is useful for capturing status information from the control system, but not for automated cleaning tools that must
 * update value status information post-ingestion.  The Sample Status API (see annotation.proto) is the designated
 * replacement for ValueStatus: acquisition-time alarm/status information (e.g., EPICS severity and status) is
 * captured as sample statuses in a status domain, and can be assigned or updated post-ingestion.
 */
message DataValue {

  /*
   * Heterogeneous Data Value
   */
  oneof value {
    string		stringValue = 1;		// character string
    bool		booleanValue = 2;		// logical Boolean
    uint32		uintValue = 3;			// unsigned integer value
    uint64		ulongValue = 4;			// unsigned long integer
    sint32		intValue = 5;			// signed integer value
    sint64		longValue = 6;			// signed long integer
    float		floatValue = 7;			// 32 byte float value
    double		doubleValue = 8;		// 64 byte float value (double)
    bytes		byteArrayValue = 9;		// raw data as byte string
    Array		arrayValue = 10;			// heterogeneous array (no dimensional restrictions as of yet)
    Structure	structureValue = 11;		// general data structure (no width or depth restrictions yet)
    Image		imageValue = 12;		// general image value
    Timestamp timestampValue = 13; // timestamp data value
  }

  /*
   * Status of Value
   *
   * Represents the condition of the value or associated hardware and software at
   * acquisition time.
   */
  ValueStatus valueStatus = 15;

  /*
   * Status of data value.
   *
   * The status definition reflects the value at acquisition time
   * (e.g., as in the EPIC record fields).
   */
  message ValueStatus {

    string message = 1;
    StatusCode statusCode = 2;
    Severity severity = 3;

    /*
     * Source of an Exceptional Status
     */
    enum StatusCode {
      NO_STATUS = 0;		// no status condition
      DEVICE_STATUS = 1;	// hardware device condition
      DRIVER_STATUS = 2;	// hardware driver condition
      RECORD_STATUS = 3;	// device database record condition
      DB_STATUS = 4; 		// device database condition
      CONF_STATUS = 5;		// configuration condition
      UNDEFINED_STATUS = 6;	// unknown or undefined status condition
      CLIENT_STATUS = 7;	// data provider client condition
    }

    /*
     * Value Alarm
     *
     * Pre-configured alarm conditions triggered by current data value.
     */
    enum Severity {
      NO_ALARM = 0;			// no alarm conditions
      MINOR_ALARM = 1;		// value has triggered a minor alarm condition
      MAJOR_ALARM = 2;		// value has triggered a major alarm condition
      INVALID_ALARM = 3;	// value has triggered an invalid alarm condition
      UNDEFINED_ALARM = 4;	// unknown or undefined alarm condition present
    }
  }
}

/*
 * Structure Data Value.
 *
 * Represents a unit of data whose value is a structure.
 *
 * Each level of a data structure may have an indefinite number of fields consisting
 * of (name, value) pairs.
 *
 * Note that the Structure message supports nested structure, and thus, complex data structures
 * can be represented.  The 'value' field within a (name, value) pair may contain another Structure
 * message supporting multi-level structuring.  The depth of the structuring is currently indefinite
 * but may have practical restrictions within service implementation (yet unreported).
 *
 * NOTE: Use of this type for ingestion is deprecated and will probably be removed in the next API version.
 * Consider using StructColumn instead.
 */
message Structure {

  repeated Field fields = 1;

  message Field {
    string name = 1;
    DataValue value = 2;
  }
}

/*
 * Array Data Value.
 *
 * Represents a unit of data whose value is an array.
 *
 * Used for vectors whose values are arrays instead of individual scalar values.  Data values are any of the defined
 * DataValue types including simple scalars as well as more complex types like structures, images, and other nested
 * arrays.  The depth of array nesting is currently indefinite but may have practical restrictions within service
 * implementation (yet unreported).
 *
 * NOTE: Use of this type for ingestion is deprecated and will probably be removed in the next API version.
 * Consider using one of the array column types instead.
 */
message Array {
  repeated DataValue dataValues = 1; // List of array data values.
}

/*
 * Image Data Value.
 *
 * Represents a unit of data whose value is an image file.
 *
 * Images are stored as raw data as a byte vector.  Interpretation is determined by standard
 * image file formats enumerated by FileType.
 *
 * Note: Use of this type for ingestion is deprecated and will probably be removed in the next API version.
 * Consider using ImageColumn instead.
 */
message Image {

  bytes image = 1;
  FileType fileType = 2;

  /*
   * Image file format.  Also used as file extension.
   */
  enum FileType {
    RAW = 0;
    JPEG = 1;
    GIF = 2;
    TIFF = 3;
    BMP = 4;
    PNG = 5;
    EPS = 6;
    SVG = 7;
    PDF = 8;
  }
}


// ------------------- Common support for streaming data ---------------------------

/*
 * DataFrame
 *
 * A DataFrame contains lists of heterogeneous data column messages, and a DataTimestamps message specifying the timestamps for
 * those columns.  Each list of columns is optimized for handling a specific data type.  Each column contains a data
 * value for each timestamp in dataTimestamps.
 *
 * DataTimestamps can be expressed using either a SamplingClock with start time, sample period,
 * and sample count, or using a TimestampsList with an explicit list of timestamps for the data values.
 *
 * DataFrame is used both as the unit of ingestion and as the content of an Annotation Calculations data frame
 * (see Calculations in annotation.proto), so calculation output has access to the same typed column types and
 * per-column ColumnMetadata — including the derivedFrom provenance links — as ingested data.
 */
message DataFrame {

  dp.service.common.DataTimestamps dataTimestamps = 1; // Required, specifies timestamps for data values.

  repeated dp.service.common.DataColumn dataColumns = 2; // Deprecated legacy column type, support may be removed in the next API version.

  repeated dp.service.common.SerializedDataColumn serializedDataColumns = 3;

  repeated dp.service.common.DoubleColumn doubleColumns = 10;
  repeated dp.service.common.FloatColumn  floatColumns  = 11;
  repeated dp.service.common.Int64Column  int64Columns  = 12;
  repeated dp.service.common.Int32Column  int32Columns  = 13;
  repeated dp.service.common.BoolColumn   boolColumns   = 14;
  repeated dp.service.common.StringColumn stringColumns = 15;
  repeated dp.service.common.EnumColumn   enumColumns   = 16;
  repeated dp.service.common.ImageColumn  imageColumns  = 17;
  repeated dp.service.common.StructColumn structColumns = 18;

  repeated dp.service.common.DoubleArrayColumn doubleArrayColumns = 20;
  repeated dp.service.common.FloatArrayColumn floatArrayColumns = 21;
  repeated dp.service.common.Int32ArrayColumn int32ArrayColumns = 22;
  repeated dp.service.common.Int64ArrayColumn int64ArrayColumns = 23;
  repeated dp.service.common.BoolArrayColumn boolArrayColumns = 24;
}

/*
 * DataBucket
 *
 * Contains bucketed time-series data for a PV over a time period as specified in the dataTimestamps. Includes
 * a DataTimestamps message specifying the timestamps for the individual data values, and a heterogeneous column
 * message containing the vector of data values with one value per timestamp. If ColumnMetadata was supplied
 * for the column at ingestion time, it is stored with the bucket and returned in the embedded column message.
 */
message DataBucket {
  string pvName = 1; // Name of PV for data column.
  DataTimestamps dataTimestamps = 2; // Specifies timestamps for bucket, using SamplingClock or explicit Timestamp list.
  string providerId = 3; // unique id of provider from most recent ingestion request.
  string providerName = 4; // name of provider from most recent ingestion request.
  DataValues dataValues = 5;
}

message DataValues {
  oneof values {

    DataColumn dataColumn = 10;
    SerializedDataColumn serializedDataColumn = 11;

    DoubleColumn doubleColumn = 12;
    FloatColumn  floatColumn  = 13;
    Int64Column  int64Column  = 14;
    Int32Column  int32Column  = 15;
    BoolColumn   boolColumn   = 16;
    StringColumn stringColumn = 17;
    EnumColumn   enumColumn   = 18;

    ImageColumn  imageColumn  = 19;
    StructColumn structColumn = 20;

    DoubleArrayColumn doubleArrayColumn = 30;
    FloatArrayColumn floatArrayColumn = 31;
    Int32ArrayColumn int32ArrayColumn = 32;
    Int64ArrayColumn int64ArrayColumn = 33;
    BoolArrayColumn boolArrayColumn = 34;
  }
}


//
// ------------------- Sample Status Definitions ---------------------------
//

/*
 * SampleStatusColumn
 *
 * Contains a vector of sample status codes for a single PV, with one entry per timestamp
 * specified by the enclosing message's DataTimestamps.  Status codes are int32 values whose
 * semantics are defined by the enclosing sample status domain, in the style of EnumColumn:
 * the (domain, code) mapping is a contract between status producers and consumers, and is not
 * validated or interpreted by the MLDP.  (A sample status domain registry for documenting
 * domain code mappings is planned; see DpAnnotationService.saveSampleStatusDomain() /
 * querySampleStatusDomains().)
 *
 * confidence and reasons are optional parallel arrays: each must either be empty (not
 * supplied) or contain exactly one entry per timestamp.  An empty string in reasons indicates
 * no reason for that sample; clients should omit an all-empty reasons list entirely rather
 * than sending empty strings.
 */
message SampleStatusColumn {
  string pvName = 1; // PV name
  repeated int32 statusCodes = 2 [packed = true]; // one code per timestamp; semantics defined by domain
  repeated float confidence = 3 [packed = true]; // optional; empty, or one value per timestamp
  repeated string reasons = 4; // optional; empty, or one value per timestamp (empty string = none)
}

/*
 * SampleStatusFrame
 *
 * The unit of sample status ingestion, paralleling DataFrame for time-series data.  A frame
 * assigns statuses in a single (domain, layer) to samples of one or more PVs sharing a single
 * DataTimestamps time axis.  Each SampleStatusColumn contains one status code per timestamp.
 *
 * domain names the semantic contract for interpreting status codes (e.g. "data_quality",
 * "ml_anomaly").  layer names the producer stream assigning the statuses (e.g. "ml_model_v1",
 * "operator_override"), allowing multiple independent interpretations of the same samples
 * within the same domain.  Together with PV name and timestamp these form the identity key of
 * an individual sample status: (pvName, timestamp, domain, layer).
 *
 * A frame need not cover all samples of the underlying data: sparse labeling is supported by
 * supplying only the timestamps of the samples being labeled (e.g. a TimestampList naming a
 * handful of suspect points), and the absence of a status for a sample means "no assertion" —
 * there is no implicit default status.  Dense labeling of every sample in a regularly-sampled
 * range is expressed efficiently with a SamplingClock axis.
 *
 * The MLDP does not validate that status timestamps correspond to archived data samples;
 * alignment of statuses with samples is a producer contract, applied when statuses are joined
 * with data at query time.  Matching is by exact (pvName, timestamp) equality at nanosecond
 * precision, so producers should label using timestamps obtained from data query results (or
 * exact SamplingClock arithmetic) — a recomputed or rounded timestamp will silently fail to
 * match.
 */
message SampleStatusFrame {
  string domain = 1; // Required, names the status code semantics contract.
  string layer = 2; // Required, names the producer stream.
  DataTimestamps dataTimestamps = 3; // Required, specifies timestamps for status values.
  repeated SampleStatusColumn statusColumns = 4; // Required, one or more columns, one per PV.
}

/*
 * SampleStatusBucket
 *
 * The unit of sample status query results, paralleling DataBucket for time-series data.
 * Contains statuses for one PV in one (domain, layer) over a contiguous time period, with a
 * DataTimestamps time axis and a SampleStatusColumn holding one status code per timestamp.
 * The PV name is carried in the embedded SampleStatusColumn.
 *
 * source / modifiedBy / updatedTime reflect only the most recent save affecting the bucket;
 * per-sample audit history is not maintained (consistent with the modifiedBy semantics of the
 * metadata APIs: last writer only, no history).
 */
message SampleStatusBucket {
  string domain = 1;
  string layer = 2;
  DataTimestamps dataTimestamps = 3; // Specifies timestamps for the bucket.
  SampleStatusColumn statusColumn = 4; // Status codes (and optional confidence/reasons), with PV name.
  string source = 5; // optional free-form provenance from most recent save affecting bucket
  string modifiedBy = 6; // optional actor / user / service identity from most recent save affecting bucket
  Timestamp updatedTime = 7; // server-set: time of most recent save affecting bucket
}


// ------------------- Common support for using calculations ---------------------------
//

/*
 * CalculationsSpec
 *
 * Provides a mechanism for using Annotation Calculations in APIs for export and query etc.
 */
message CalculationsSpec {

  /*
   * calculationsId: Required, specifies unique id of Calculations object to include in the result.
   *
   * Obtain it from SaveAnnotationResult.calculationsId when saving, or from Annotation.calculationsId in
   * queryAnnotations() / getAnnotation() results.  It is the single addressing key for Calculations across
   * the API: this spec, DpAnnotationService.getCalculations(), and ColumnProvenance.CalculationsColumn all
   * use it.
   */
  string calculationsId = 1;

  // dataFrameColumns: Optional, map of CalculationsDataFrame name to the columns in that frame to include in the result.
  map<string, ColumnNameList> dataFrameColumns = 2;

  message ColumnNameList {
    /*
     * Defining list of strings as a data type that can be used as the value in a map, since we can't use
     * "repeated string" directly.
     */
    repeated string columnNames = 1;
  }
}

