//
// ------------------- Sample Status Save Request/Response ---------------------------
//

/*
 * SaveSampleStatusesRequest
 *
 * Batch upsert of sample statuses.  Each SampleStatusFrame assigns statuses in one
 * (domain, layer) to one or more PVs sharing a DataTimestamps time axis.
 *
 * Upsert semantics are per individual sample status, keyed by (pvName, timestamp, domain,
 * layer); see saveSampleStatuses().  WARNING: saving a key that already exists replaces that
 * status IN FULL — statusCode, confidence, and reasons alike — so callers must supply the
 * complete desired state for each status; re-saving with an empty confidence or reasons list
 * clears any previously stored values (there is no patch-style partial update of a status).
 * To cleanly re-label a time range, call deleteSampleStatuses() for the range first.
 *
 * Frames are processed in request order; if the same identity key appears in more than one
 * frame, the later frame wins and savedCount counts each write.
 *
 * source and modifiedBy apply to all frames in the request and are recorded at storage-bucket
 * granularity (last writer only; per-sample audit history is not maintained).  Batch frames
 * from a single producer per request: mixing producers in one request records the same
 * source/modifiedBy for all of them, misattributing provenance.
 *
 * Note: updatedTime is a server-set audit timestamp and is not accepted as input; it is
 * returned in query responses only.
 *
 * Validation rules applied by the service:
 *   - frames must contain at least one SampleStatusFrame.
 *   - Each frame requires domain, layer, dataTimestamps, and at least one statusColumn.
 *   - A PV may appear in at most one statusColumn per frame.
 *   - In each column, statusCodes must contain exactly one entry per timestamp; confidence
 *     and reasons must each be empty or contain exactly one entry per timestamp.
 *   - dataTimestamps must specify at least one timestamp: a SamplingClock requires
 *     periodNanos > 0 and count >= 1; a TimestampList must be non-empty with strictly
 *     increasing timestamps.
 *   - Batch size limits may be enforced by server configuration; oversized requests are
 *     rejected.
 */
message SaveSampleStatusesRequest {
  repeated dp.service.common.SampleStatusFrame frames = 1; // required, one or more frames
  string source = 2; // optional free-form provenance describing the producer, applies to all frames
  string modifiedBy = 3; // optional actor / user / service identity, applies to all frames
}

/*
 * SaveSampleStatusesResponse
 *
 * Contains the response to a saveSampleStatuses() request.  Payload is an ExceptionalResult
 * if the request is rejected or an error is encountered, otherwise contains a
 * SaveSampleStatusesResult.
 */
message SaveSampleStatusesResponse {

  dp.service.common.Timestamp responseTime = 1; // Indicates time response was generated.

  oneof result {
    dp.service.common.ExceptionalResult exceptionalResult = 10;
    SaveSampleStatusesResult saveSampleStatusesResult = 11;
  }

  /*
   * SaveSampleStatusesResult
   *
   * Contains the result of a successful saveSampleStatuses() request.
   */
  message SaveSampleStatusesResult {
    uint64 savedCount = 1; // total individual sample statuses upserted, across all frames and columns
  }
}


//
// ------------------- Sample Status Query ---------------------------
//

/*
 * QuerySampleStatusesRequest
 *
 * Contains parameters for a sample status query.  Used by both querySampleStatuses() (unary,
 * resumable paging) and querySampleStatusesStream() (server-streaming, fire-and-consume).
 *
 * Combining semantics:
 *   - The filter fields (pvNames, domains, layers) are combined with logical AND.
 *   - Multiple values within a single field are combined with logical OR (exact match).
 *   - All three are optional filters: an empty list matches all values.  An empty pvNames
 *     list matches all PVs with statuses in the range — the way to enumerate which PVs a
 *     (domain, layer) has labeled, e.g. before retiring the layer.
 *
 * Pagination (unary):
 *   - limit specifies the maximum number of buckets to return per response
 *     (0 = server-selected default).
 *   - pageToken is omitted on the first request; subsequent requests supply the nextPageToken
 *     returned in the previous response.  An empty nextPageToken in the response indicates no
 *     further pages.
 *
 * Streaming: limit is the per-message chunk size; pageToken must be empty (a non-empty token
 * is rejected with an ExceptionalResult).
 */
message QuerySampleStatusesRequest {
  dp.service.common.TimeRange timeRange = 1; // Required, query time interval.
  repeated string pvNames = 2; // Optional filter (exact match, ORed); empty = all PVs.
  repeated string domains = 3; // Optional filter (exact match, ORed); empty = all domains.
  repeated string layers = 4; // Optional filter (exact match, ORed); empty = all layers.
  uint32 limit = 5;
  string pageToken = 6;
}

/*
 * QuerySampleStatusesResponse
 *
 * Contains the results of a querySampleStatuses() / querySampleStatusesStream() request.
 * Payload is an ExceptionalResult if the request is rejected or an error is encountered,
 * otherwise contains a QuerySampleStatusesResult with the matching buckets.
 *
 * An empty query result is returned as a QuerySampleStatusesResult with an empty
 * sampleStatusBuckets list (not an ExceptionalResult).
 */
message QuerySampleStatusesResponse {

  dp.service.common.Timestamp responseTime = 1; // Indicates time response was generated.

  oneof result {
    dp.service.common.ExceptionalResult exceptionalResult = 10;
    QuerySampleStatusesResult querySampleStatusesResult = 11;
  }

  /*
   * QuerySampleStatusesResult
   *
   * One page of SampleStatusBucket objects.  Buckets are ordered by (pvName, domain, layer,
   * bucket start time); every bucket is complete — paging boundaries always fall between
   * buckets.  For unary querySampleStatuses(), nextPageToken is non-empty when more pages are
   * available; supply it as pageToken to continue, and an empty nextPageToken indicates the
   * last page.  For querySampleStatusesStream(), nextPageToken is always empty (the stream
   * itself signals completion).
   */
  message QuerySampleStatusesResult {
    repeated dp.service.common.SampleStatusBucket sampleStatusBuckets = 1;
    string nextPageToken = 2;
  }
}


