//
// ------------------- DataSet Query ---------------------------
//

/*
 * QueryDataSetsRequest
 *
 * Contains parameters for a query over existing DataSets.  A query includes a list of (zero or more) criteria,
 * plus pagination parameters.
 *
 * Criteria semantics: multiple criteria in the criteria list are combined with AND; multiple values within a
 * single criterion are combined with OR.  E.g., a request with an OwnerCriterion and a TagsCriterion listing two
 * tags matches DataSets owned by that owner AND carrying either tag.  Requiring two tags simultaneously takes two
 * separate TagsCriterion entries.  An empty criteria list matches all DataSets.
 *
 * Pagination: limit is the maximum number of records in a page; an unset or zero limit means a server-configured
 * default page size, not an unbounded result.  pageToken is an opaque continuation token from the nextPageToken of
 * a previous response; a malformed token is rejected with an ExceptionalResult.  Results are ordered by id
 * ascending; see queryDataSets().
 */
message QueryDataSetsRequest {

  repeated QueryDataSetsCriterion criteria = 1;

  uint32 limit = 2;
  string pageToken = 3;

  /*
   * QueryDataSetsCriterion
   *
   * A single search criterion.  Exactly one criterion must be set.
   */
  message QueryDataSetsCriterion {

    /*
     * Field numbers are not in declaration order: the criteria carried over from earlier
     * releases keep the numbers they have always had, and criteria added in the 1.16.0
     * modernization take fresh numbers above them.  Declaration order follows the order the
     * criteria are documented in.  Do not renumber.
     */
    oneof criterion {
      IdCriterion idCriterion = 10; // Query by DataSet id.
      OwnerCriterion ownerCriterion = 11; // Query by owner.
      NameCriterion nameCriterion = 14; // Query by DataSet name.
      TextCriterion textCriterion = 12; // Full text search.
      PvNameCriterion pvNameCriterion = 13; // Query by PV name appearing in a DataBlock.
      TagsCriterion tagsCriterion = 15; // Query by tag / keyword value.
      AttributesCriterion attributesCriterion = 16; // Query attribute pairs by key and value.
    }

    /*
     * IdCriterion
     *
     * Match DataSets by id.  Multiple ids within a single IdCriterion are ORed.
     *
     * This is the batch-retrieval path for the dataSetIds returned by queryAnnotations():
     * gather the ids across the returned annotations and fetch all the referenced DataSets
     * in one call, rather than issuing a getDataSet() per id.
     */
    message IdCriterion {
      repeated string ids = 1;
    }

    /*
     * OwnerCriterion
     *
     * Match DataSets by ownerId.  Multiple owners within a single OwnerCriterion are ORed.
     */
    message OwnerCriterion {
      repeated string ownerIds = 1;
    }

    /*
     * NameCriterion
     *
     * Match DataSets by name.  Values across all three sub-lists are ORed: a name matches
     * if it satisfies any supplied value from any sub-list.
     */
    message NameCriterion {
      repeated string exact = 1;    // exact string match
      repeated string prefix = 2;   // prefix match
      repeated string contains = 3; // substring match
    }

    /*
     * TextCriterion
     *
     * Full-text search over the DataSet record's indexed text fields, which are name and
     * description.
     *
     * This is a collection-level text index search, not a per-field match: the searchable
     * field set is a property of the index and cannot be scoped to named fields at query
     * time.  Use NameCriterion when a match must be restricted to the name.
     */
    message TextCriterion {
      string text = 1;
    }

    /*
     * PvNameCriterion
     *
     * Match DataSets having a DataBlock that names any of the specified PVs.  Multiple PV
     * names within a single PvNameCriterion are ORed.
     */
    message PvNameCriterion {
      repeated string names = 1;
    }

    /*
     * TagsCriterion
     *
     * Match DataSets that have any of the specified tags.  Multiple tags within a single
     * TagsCriterion are ORed; use separate TagsCriterion entries in the outer criteria list
     * (ANDed) to require multiple tags simultaneously.
     */
    message TagsCriterion {
      repeated string values = 1;
    }

    /*
     * AttributesCriterion
     *
     * Match DataSets by attribute key and optional value(s).
     * key (maps to Attribute.name) is required.
     * values is optional: if non-empty, the record must have the key with one of the
     * specified values (OR); if empty, any record possessing the key matches regardless of
     * its value (key-only / existence search).
     */
    message AttributesCriterion {
      string key = 1;             // required; matches Attribute.name
      repeated string values = 2; // optional; empty list = key-only search
    }
  }
}

/*
 * QueryDataSetsResponse
 *
 * Contains the results of a queryDataSets() request.  Payload is an ExceptionalResult if the request is rejected
 * or an error is encountered processing the query, otherwise contains a DataSetsResult with the matching DataSets.
 *
 * An empty query result is returned as a DataSetsResult with an empty dataSets list (not an ExceptionalResult).
 */
message QueryDataSetsResponse {

  dp.service.common.Timestamp responseTime = 1; // Indicates time response was generated.

  // result: Response contains either an ExceptionalResult indicating a problem handling the request,
  // or DataSetsResult with query result.
  oneof result {
    dp.service.common.ExceptionalResult exceptionalResult = 10;
    DataSetsResult dataSetsResult = 11;
  }

  /*
   * DataSetsResult
   *
   * Contains a page of DataSet records matching the query criteria, ordered by id ascending.
   *
   * nextPageToken is non-empty when additional pages are available; supply it as pageToken in the next request to
   * retrieve the following page.  An empty nextPageToken indicates the last page.
   */
  message DataSetsResult {
    repeated DataSet dataSets = 1;
    string nextPageToken = 2;
  }
}


//
// ------------------- Calculations Model ---------------------------
//

/*
 * Calculations.
 *
 * Defines the data structure used for representing user-defined Calculations attached to an Annotation.
 * To the extent possible, it parallels the data structures used in the ingestion of regular time-series data in order
 * that user-defined Calculations can be treated in a similar fashion for the purposes of querying and exporting data
 * that includes both PV data and user-defined Calculations.
 *
 * The Calculations object includes a list of CalculationsDataFrames.  Each CalculationsDataFrame includes a name and
 * a common.DataFrame, which carries the timestamps for the frame plus a list of typed data columns, each containing
 * a value for each timestamp.
 *
 * It might be helpful to use the analogy of an Excel workbook.  The Calculations object is the workbook, and each
 * CalculationsDataFrame is a worksheet in that workbook that contains a column of timestamps and columns of
 * calculated data with a value for each timestamp.
 *
 * Lifecycle: Calculations are owned by an Annotation.  They are created and replaced through saveAnnotation() and
 * are deleted when their Annotation is deleted.  They are stored separately and can be retrieved on their own with
 * getCalculations(), which is why they carry their own id.
 */
message Calculations {

  /*
   * id: server-generated primary key.
   *
   * This is the single addressing key for Calculations across the API — getCalculations(),
   * common.CalculationsSpec, and common.ColumnProvenance.CalculationsColumn all take it.  It is returned in
   * SaveAnnotationResult and in Annotation.calculationsId.  Ignored on input to saveAnnotation().
   */
  string id = 1;

  repeated CalculationsDataFrame calculationDataFrames = 2;

  /*
   * CalculationsDataFrame
   *
   * One named frame of calculation output: a time axis plus the columns sharing it.
   *
   * Column typing: the frame's DataFrame provides the same typed scalar / array / image / struct / serialized
   * column types used for ingestion, plus per-column ColumnMetadata, which is where column-level provenance
   * (ColumnProvenance.derivedFrom) is recorded.  The legacy DataColumn type remains reachable through
   * DataFrame.dataColumns as an escape hatch for heterogeneously typed columns or columns with missing values;
   * prefer the typed columns otherwise.
   *
   * Sparsity: a calculation whose values occur at a different or sparser cadence than its siblings gets its own
   * frame with its own time axis, rather than a dense column padded with missing values.  Data frames are cheap,
   * and every column is dense on its own frame's axis.
   *
   * Export: the tabular output formats (CSV, XLSX) can only represent scalar columns; a frame containing array,
   * image, or struct columns can be exported to HDF5 only.  See exportData().
   */
  message CalculationsDataFrame {
    string name = 1; // Required, name of data frame.  Must be distinct within a Calculations object — frame names
                     // address frames in CalculationsSpec.dataFrameColumns and in provenance links, so duplicates
                     // are unaddressable and are rejected.
    dp.service.common.DataFrame frame = 2; // Required, timestamps plus the columns of calculated data.
  }
}


//
// ------------------- Calculations Get Request/Response ---------------------------
//

/*
 * GetCalculationsRequest
 *
 * Retrieve a single Calculations object by id.
 */
message GetCalculationsRequest {
  string calculationsId = 1; // required id of the Calculations object to retrieve
}

/*
 * GetCalculationsResponse
 *
 * Contains the result of a getCalculations() request.  Payload is an ExceptionalResult if
 * the request is rejected, an error is encountered, or no Calculations object exists with
 * the specified id, otherwise contains a GetCalculationsResult with the matching record.
 */
message GetCalculationsResponse {

  dp.service.common.Timestamp responseTime = 1; // Indicates time response was generated.

  oneof result {
    dp.service.common.ExceptionalResult exceptionalResult = 10;
    GetCalculationsResult getCalculationsResult = 11;
  }

  /*
   * GetCalculationsResult
   *
   * Contains the result of a successful getCalculations() request.
   */
  message GetCalculationsResult {
    Calculations calculations = 1; // the matching Calculations record
  }
}


//
// ------------------- Annotation Model ---------------------------
//

/*
 * Annotation
 *
 * A user-supplied record describing archived data: descriptive text and cataloging metadata, the DataSets the
 * description applies to, links to related Annotations, and optionally user-defined Calculations derived from the
 * data.
 *
 * The primary key is an opaque server-generated id.  Annotation names are not unique, so the id is the only way to
 * address a specific record in getAnnotation(), deleteAnnotation(), patchAnnotation(), and the annotationIds of
 * other Annotations.
 *
 * References, not embedded content: dataSetIds and calculationsId are ids.  Dataset content is retrieved with
 * getDataSet(), or in bulk with queryDataSets() and an IdCriterion listing the ids; calculations content is
 * retrieved with getCalculations(), or inline from getAnnotation().
 *
 * Provenance: this message carries the document level of provenance — dataSetIds names the archived data a
 * calculation was derived from, and annotationIds links to related Annotations.  The finer, column level lives in
 * common.ColumnProvenance.derivedFrom on the individual calculation columns.  annotationIds are soft associations
 * and may dangle; a link that resolves to nothing means the referenced Annotation was deleted.
 */
message Annotation {

  string id = 1; // server-generated primary key
  string ownerId = 2; // required annotation owner
  repeated string dataSetIds = 3; // required list of ids of associated DataSets, might contain a single DataSet
  string name = 4; // required brief name; not unique
  repeated string annotationIds = 5; // optional list of ids of associated Annotations; soft links, may dangle
  string description = 6; // optional free-form descriptive text
  repeated string tags = 7; // optional list of keywords / tags for cataloging Annotation
  repeated dp.service.common.Attribute attributes = 8; // optional list of key/value attribute pairs for cataloging Annotation

  /*
   * calculationsId: id of the Annotation's Calculations object, empty if it has none.
   *
   * Always populated when calculations exist, in both queryAnnotations() and getAnnotation() results, so it also
   * serves as the presence indicator: an empty calculationsId means the Annotation has no calculations, and a
   * non-empty one with an empty calculations field below means the content was simply not fetched by this method.
   */
  string calculationsId = 9;

  /*
   * calculations: Calculations content, populated by getAnnotation() ONLY.
   *
   * queryAnnotations() leaves this empty and returns calculationsId alone, so that listing annotations does not
   * drag their full column sets along.  Use getCalculations() or getAnnotation() to retrieve the content.
   */
  Calculations calculations = 10;

  dp.service.common.Timestamp createdTime = 11; // server-set: time the record was created
  dp.service.common.Timestamp updatedTime = 12; // server-set: time of most recent save affecting the record
  string modifiedBy = 13; // optional actor / user / service identity from most recent save
}


//
// ------------------- Annotation Save Request/Response ---------------------------
//

/*
 * SaveAnnotationRequest
 *
 * Encapsulates the details for creating or replacing an Annotation.  Required fields: ownerId (unique id of
 * owner), dataSetIds (list of ids of associated DataSets), and name (brief annotation name).  The remaining fields
 * are optional, and are used for linking to associated Annotations, adding descriptive information, cataloging,
 * and attaching user-defined Calculations.
 *
 * Full replace (upsert) semantics:
 *   - If id is empty, a new Annotation is created and the server generates its id.
 *   - If id is supplied, ownerId / dataSetIds / name / annotationIds / description / tags /
 *     attributes / calculations / modifiedBy are ALL replaced with the values in this request.
 *
 * WARNING: Fields omitted from the request are NOT preserved on update.  Callers must supply the complete desired
 * state on every save.  This includes calculations: an update that omits calculations CLEARS the Annotation's
 * existing calculations, which is the most costly instance of the general rule.  Read the current state with
 * getAnnotation() and resend it if you are updating other fields.  patchAnnotation() (future placeholder) will
 * provide partial-update semantics.
 *
 * Note: the audit timestamps createdTime and updatedTime are server-set and are not accepted as input; they are
 * returned in getAnnotation() and queryAnnotations() responses only.
 *
 * Recording provenance for Calculations derived from archived PV data:
 *
 * - Create a DataSet whose DataBlocks reference the PVs and time range(s) used in the calculation.
 * - Save an Annotation listing that DataSet's id in dataSetIds, carrying the Calculations.
 *
 * For Calculations derived from other user-defined Calculations, list the id of the Annotation owning the original
 * Calculations in annotationIds.
 *
 * Both of the above are document-level provenance.  Individual calculation columns can additionally carry
 * column-level provenance in their ColumnMetadata: common.ColumnProvenance.derivedFrom names the specific source
 * PVs or Calculations columns, and optionally the source time interval consumed.
 */
message SaveAnnotationRequest {
  string id = 1; // optional id of existing Annotation to replace; empty = create a new Annotation
  string ownerId = 2; // required annotation owner
  repeated string dataSetIds = 3; // required list of associated datasets, might contain a single dataset
  string name = 4; // required brief name
  repeated string annotationIds = 5; // optional list of associated annotations, for provenance / linking of calculations
  string description = 6; // optional free-form descriptive text
  repeated string tags = 7; // optional list of keywords / tags for cataloging Annotation
  repeated dp.service.common.Attribute attributes = 8; // optional list of key/value attribute pairs for cataloging Annotation
  string modifiedBy = 9; // optional actor / user / service identity performing this save

  /*
   * calculations: optional user-defined calculations.
   *
   * The id field of the supplied Calculations object is IGNORED on save; the server assigns the id and returns it
   * in SaveAnnotationResult.calculationsId.  There is no saveCalculations() — this is the write path.
   */
  Calculations calculations = 10;
}

/*
 * SaveAnnotationResponse
 *
 * Contains details for response to request to create or replace an Annotation.  Response includes either
 * an ExceptionalResult describing a rejection or error situation, or a SaveAnnotationResult indicating the request
 * was handled successfully.
 */
message SaveAnnotationResponse {

  dp.service.common.Timestamp responseTime = 1; // Indicates time response was generated.

  // result: Contains query result payload with either ExceptionalResult or SuccessfulResult as described above.
  oneof result {
    dp.service.common.ExceptionalResult exceptionalResult = 10;
    SaveAnnotationResult saveAnnotationResult = 11;
  }

/*
 * Successful Annotation Result.
 *
 * Contains the results of a successful request to save an Annotation, including the id for the new or updated
 * Annotation.
 */
  message SaveAnnotationResult {

    string annotationId = 1;

    /*
     * calculationsId: id of the saved Calculations object, empty if the request carried no calculations.
     *
     * Returned here so the addressing key used by getCalculations(), common.CalculationsSpec, and
     * common.ColumnProvenance.CalculationsColumn is available without a further round trip.
     */
    string calculationsId = 2;
  }
}


//
// ------------------- Annotation Get / Delete / Patch ---------------------------
//

/*
 * GetAnnotationRequest
 *
 * Retrieve a single Annotation by id, with its Calculations content populated inline.
 */
message GetAnnotationRequest {
  string annotationId = 1; // required id of the Annotation to retrieve
}

/*
