//
// ------------------- Annotations Query ---------------------------
//

/*
 * QueryAnnotationsRequest
 *
 * Contains parameters for a query over existing Annotations.  A query includes a list of (zero or more) criteria,
 * plus pagination parameters.
 *
 * Criteria semantics: multiple criteria in the criteria list are combined with AND; multiple values within a
 * single criterion are combined with OR.  E.g., a request with an OwnerCriterion and a TagsCriterion listing two
 * tags matches Annotations owned by that owner AND carrying either tag.  Requiring two tags simultaneously takes
 * two separate TagsCriterion entries.  An empty criteria list matches all Annotations.
 *
 * Pagination: limit is the maximum number of records in a page; an unset or zero limit means a server-configured
 * default page size, not an unbounded result.  pageToken is an opaque continuation token from the nextPageToken of
 * a previous response; a malformed token is rejected with an ExceptionalResult.  Results are ordered by id
 * ascending; see queryAnnotations().
 */
message QueryAnnotationsRequest {

  repeated QueryAnnotationsCriterion criteria = 1;

  uint32 limit = 2;
  string pageToken = 3;

  /*
   * QueryAnnotationsCriterion
   *
   * A single search criterion.  Exactly one criterion must be set.
   */
  message QueryAnnotationsCriterion {

    /*
     * Field numbers are not in declaration order: the criteria carried over from earlier
     * releases keep the numbers they have always had, and criteria added in the 1.16.0
     * modernization take fresh numbers above them.  Declaration order follows the order the
     * criteria are documented in.  Do not renumber.
     */
    oneof criterion {
      IdCriterion idCriterion = 10;  // Query by Annotation id.
      OwnerCriterion ownerCriterion = 11;  // Query by owner.
      DataSetsCriterion dataSetsCriterion = 12; // Query by id of associated DataSet.
      AnnotationsCriterion annotationsCriterion = 13; // Query by id of associated Annotation.
      NameCriterion nameCriterion = 17; // Query by Annotation name.
      TextCriterion textCriterion = 14; // Full text search.
      TagsCriterion tagsCriterion = 15; // Query by tag / keyword value.
      AttributesCriterion attributesCriterion = 16; // Query attribute pairs by key and value.
    }

    /*
     * IdCriterion
     *
     * Match Annotations by id.  Multiple ids within a single IdCriterion are ORed.
     */
    message IdCriterion {
      repeated string ids = 1;
    }

    /*
     * OwnerCriterion
     *
     * Match Annotations by ownerId.  Multiple owners within a single OwnerCriterion are ORed.
     */
    message OwnerCriterion {
      repeated string ownerIds = 1;
    }

    /*
     * DataSetsCriterion
     *
     * Match Annotations referencing any of the specified DataSet ids in dataSetIds.
     * Multiple ids within a single DataSetsCriterion are ORed.
     *
     * This is also how to find the Annotations that block a deleteDataSet().
     */
    message DataSetsCriterion {
      repeated string dataSetIds = 1;
    }

    /*
     * AnnotationsCriterion
     *
     * Match Annotations referencing any of the specified Annotation ids in annotationIds.
     * Multiple ids within a single AnnotationsCriterion are ORed.
     */
    message AnnotationsCriterion {
      repeated string annotationIds = 1;
    }

    /*
     * NameCriterion
     *
     * Match Annotations by name.  Values across all three sub-lists are ORed: a name matches
     * if it satisfies any supplied value from any sub-list.
     */
    message NameCriterion {
      repeated string exact = 1;    // exact string match
      repeated string prefix = 2;   // prefix match
      repeated string contains = 3; // substring match
    }

    /*
     * TextCriterion
     *
     * Full-text search over the Annotation record's indexed text fields, which are name and
     * description.
     *
     * This is a collection-level text index search, not a per-field match: the searchable
     * field set is a property of the index and cannot be scoped to named fields at query
     * time.  Use NameCriterion when a match must be restricted to the name.
     */
    message TextCriterion {
      string text = 1;
    }

    /*
     * TagsCriterion
     *
     * Match Annotations that have any of the specified tags.  Multiple tags within a single
     * TagsCriterion are ORed; use separate TagsCriterion entries in the outer criteria list
     * (ANDed) to require multiple tags simultaneously.
     */
    message TagsCriterion {
      repeated string values = 1;
    }

    /*
     * AttributesCriterion
     *
     * Match Annotations by attribute key and optional value(s).
     * key (maps to Attribute.name) is required.
     * values is optional: if non-empty, the record must have the key with one of the
     * specified values (OR); if empty, any record possessing the key matches regardless of
     * its value (key-only / existence search).
     */
    message AttributesCriterion {
      string key = 1;             // required; matches Attribute.name
      repeated string values = 2; // optional; empty list = key-only search
    }
  }
}

/*
 * QueryAnnotationsResponse
 *
 * Contains the results of a queryAnnotations() request.  Payload is an ExceptionalResult if the request is
 * rejected or an error is encountered processing the query, otherwise contains an AnnotationsResult with the
 * matching Annotations.
 *
 * An empty query result is returned as an AnnotationsResult with an empty annotations list (not an
 * ExceptionalResult).
 */
message QueryAnnotationsResponse {

  dp.service.common.Timestamp responseTime = 1; // Indicates time response was generated.

  // result: Response contains either an ExceptionalResult indicating a problem handling the request,
  // or AnnotationsResult with query result.
  oneof result {
    dp.service.common.ExceptionalResult exceptionalResult = 10;
    AnnotationsResult annotationsResult = 11;
  }

  /*
   * AnnotationsResult
   *
   * Contains a page of Annotation records matching the query criteria, ordered by id ascending.
   *
   * Returned Annotations carry references, not embedded content: dataSetIds and calculationsId are populated, and
   * the calculations field is empty.  Fetch the referenced DataSets in a single queryDataSets() call using an
   * IdCriterion listing the ids gathered across the page, and calculations with getCalculations().
   *
   * nextPageToken is non-empty when additional pages are available; supply it as pageToken in the next request to
   * retrieve the following page.  An empty nextPageToken indicates the last page.
   */
  message AnnotationsResult {
    repeated Annotation annotations = 1;
    string nextPageToken = 2;
  }
}


//
// ------------------- Export ---------------------------
//

/*
 * ExportDataRequest
 *
 * Used as parameter to the exportData() method.  Specifies the data to be exported and the desired output file
 * format.
 *
 * Data sources: dataSetId (a saved DataSet), dataBlocks (an inline ad-hoc specification), and calculationsSpec
 * (Calculations content).  All three are optional individually, but AT LEAST ONE must be supplied; a request
 * specifying none is rejected.  Sources may be combined in a single export, and their contents are merged into one
 * output file.
 *
 * Output format restriction: the tabular formats (CSV, XLSX) can only represent scalar columns.  A DataSet or
 * Calculations object containing array, image, or struct columns can be exported to HDF5, but a request to export
 * it as CSV or XLSX is rejected.
 */
message ExportDataRequest {

  string dataSetId = 1;  // Optional, specifies id of a saved DataSet to be exported.

  dp.service.common.CalculationsSpec calculationsSpec = 2; // Optional, specifies details of Calculations to include in export.

  ExportOutputFormat outputFormat = 3;  // Required, specifies export output file format.

  /*
   * dataBlocks: Optional, an inline ad-hoc specification of data to export.
   *
   * Uses the same DataBlock building block a DataSet contains — a time range plus a list of PV names — and is
   * treated by the server as a transient DataSet.  This is the path for a one-off export that does not warrant
   * saving a DataSet; use dataSetId when the selection is worth keeping and re-using.
   */
  repeated DataBlock dataBlocks = 4;

  enum ExportOutputFormat {
    EXPORT_FORMAT_UNSPECIFIED = 0; // Indicates no enum value has been specified, and the request will be rejected.
    EXPORT_FORMAT_HDF5 = 1; // HDF5 file containing bucketed data for multiple PVs.
    EXPORT_FORMAT_CSV = 2; // Tabular comma-separated values format.
    EXPORT_FORMAT_XLSX = 3; // Tabular Excel format.
  }
}

/*
 * ExportDataResponse
 *
 * Used as response from the exportData() method.  Payload includes either an ExceptionalResult indicating a problem
 * in handling the export request, or an ExportDataResult for a successful request.
 *
 * ExportDataResult includes fields specifying the full path for the export output file and
 * (optionally if configured) the URL for accessing the file via a web server.
 */
message ExportDataResponse {

  dp.service.common.Timestamp responseTime = 1; // Indicates time response was generated.

  oneof result {
    dp.service.common.ExceptionalResult exceptionalResult = 10; // Indicates a problem was encountered in handling the request.
    ExportDataResult exportDataResult = 11; // Indicates the request was handled successfully.
  }

  message ExportDataResult {
    string filePath = 1; // Specifies full path to export output file.
    string fileUrl = 2; // (If configured to generate URLs) Specifies URL for accessing file via web server.
  }
}


