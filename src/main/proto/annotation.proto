 *     a record satisfies the criterion if it matches ANY supplied value.
 *   - An empty criteria list matches ALL records; it is not an error.  This is
 *     the browse-all entry point: no criteria means no filtering, so every
 *     record is eligible, subject to the pagination bound below.
 *
 * Pagination:
 *   - limit specifies the maximum number of records to return per response.
 *     An unset or zero limit means a server-configured default page size, NOT an
 *     unbounded result.  The default is unconditional: it does not depend on
 *     whether criteria were supplied, so removing the last criterion from a
 *     request does not change its page size.  Follow nextPageToken to retrieve
 *     all matching records.
 *   - pageToken is omitted on the first request; subsequent requests supply
 *     the nextPageToken returned in the previous response.
