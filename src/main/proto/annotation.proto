//
// annotation.proto
//
// Contains RPC messages and interface specific to the Annotation Service.

syntax = "proto3";

package dp.service.annotation;

option java_multiple_files = true;
option java_package = "com.ospreydcs.dp.grpc.v1.annotation";

import "common.proto";


//
// ------------------- RPC Interfaces ---------------------------
//

/*
 * Annotation Service Interface
 *
 * Interface for annotating archived data.
 */
service DpAnnotationService {

  //
  // ------------------- DataSet CRUD ---------------------------
  //

  /*
   * saveDataSet()
   *
   * Create or replace a DataSet.
   *
   * Full replace (upsert) semantics: if the request omits id a new DataSet is created and
   * the server generates its id; if id is supplied, ALL fields of the existing DataSet
   * (name, ownerId, description, dataBlocks, tags, attributes, modifiedBy) are replaced
   * with the request contents.  Callers must supply the complete desired state on every
   * call — fields omitted from the request are not preserved.  Use patchDataSet() (future)
   * for partial updates.
   *
   * The response may indicate rejection, an error handling the request, or a
   * SaveDataSetResult with the id of the created or updated DataSet.
   */
  rpc saveDataSet(SaveDataSetRequest) returns (SaveDataSetResponse);

  /*
   * getDataSet()
   *
   * Retrieve a single DataSet by id.
   *
   * This is the content-retrieval path for the dataSetIds returned by queryAnnotations():
   * annotation query results carry dataset ids only, not embedded dataset content.  To
   * retrieve many datasets at once, prefer queryDataSets() with an IdCriterion listing the
   * ids — it is a single round trip, whereas a getDataSet() per id is not.
   *
   * The response may indicate rejection, an error handling the request, or a
   * GetDataSetResult containing the matching record.  If no DataSet exists with the
   * specified id, an ExceptionalResult is returned.
   */
  rpc getDataSet(GetDataSetRequest) returns (GetDataSetResponse);

  /*
   * queryDataSets(): Unary (non-streaming) DataSets query.
   *
   * Query DataSet records using structured search criteria.  Client sends a single
   * QueryDataSetsRequest and receives a single QueryDataSetsResponse.
   *
   * Pagination: limit sets the maximum number of records in a page; an unset or zero limit
   * means a server-configured default page size, NOT an unbounded result.  Clients must
   * follow nextPageToken to retrieve all matching records.  pageToken is an opaque
   * continuation token obtained from a previous response; a malformed token is rejected
   * with an ExceptionalResult.
   *
   * Ordering: results are ordered by id ascending.  The id is unique, which makes paging
   * stable, and is approximately insertion order.  Ordering is part of this method's
   * contract — paging is only well defined under a deterministic sort.
   *
   * The response may indicate rejection, an error in handling, or otherwise contains the
   * DataSets matching the query criteria.  A query matching no data returns an empty
   * result, not an ExceptionalResult.
   */
  rpc queryDataSets(QueryDataSetsRequest) returns (QueryDataSetsResponse);

  /*
   * deleteDataSet()
   *
   * Delete the DataSet with the specified id.
   *
   * The request is rejected if any Annotation references the DataSet in its dataSetIds — a
   * containment-strength association.  Delete or update those annotations first.  Use
   * queryAnnotations() with a DataSetsCriterion to find them.
   *
   * The response may indicate rejection, an error handling the request, or a
   * DeleteDataSetResult confirming the id of the deleted record.
   */
  rpc deleteDataSet(DeleteDataSetRequest) returns (DeleteDataSetResponse);

  /*
   * patchDataSet()
   *
   * Partial update of an existing DataSet.  Allows individual fields (name, description,
   * dataBlocks, tags, attributes, modifiedBy) to be updated without replacing the entire
   * record, unlike the full-replace semantics of saveDataSet().
   *
   * NOT YET IMPLEMENTED — calling this method returns an error response.
   * Planned for a future release.  Field mask design is deferred.
   *
   * This method is defined now to reserve its name and message shapes as part
   * of the standard CRUD pattern for metadata APIs in this service.
   */
  rpc patchDataSet(PatchDataSetRequest) returns (PatchDataSetResponse);


  //
  // ------------------- Annotation CRUD ---------------------------
  //

  /*
   * saveAnnotation()
   *
   * Create or replace an Annotation.
   *
   * Full replace (upsert) semantics: if the request omits id a new Annotation is created
   * and the server generates its id; if id is supplied, ALL fields of the existing
   * Annotation (ownerId, dataSetIds, name, annotationIds, description, tags, attributes,
   * calculations, modifiedBy) are replaced with the request contents.  Callers must supply
   * the complete desired state on every call — fields omitted from the request are not
   * preserved.  Use patchAnnotation() (future) for partial updates.
   *
   * WARNING: full replace applies to calculations as it does to every other field.  An
   * update that omits calculations CLEARS the annotation's existing calculations.
   *
   * Calculations are created and replaced through this method — there is no
   * saveCalculations().  The response returns calculationsId alongside annotationId when
   * the request carried calculations, so the addressing key used by getCalculations(),
   * CalculationsSpec, and ColumnProvenance is available without a further round trip.
   *
   * The response may indicate rejection, an error handling the request, or a
   * SaveAnnotationResult with the id of the created or updated Annotation.
   */
  rpc saveAnnotation(SaveAnnotationRequest) returns (SaveAnnotationResponse);

  /*
   * getAnnotation()
   *
   * Retrieve a single Annotation by id, with its Calculations content populated inline as a
   * one-hop convenience for the common "open this annotation" case.  This is the only
   * method that returns calculations content within an Annotation; queryAnnotations()
   * returns calculationsId only.
   *
   * Associated DataSets are returned as ids (dataSetIds), not content; use getDataSet() or
   * queryDataSets() with an IdCriterion to retrieve them.
   *
   * The response may indicate rejection, an error handling the request, or a
   * GetAnnotationResult containing the matching record.  If no Annotation exists with the
   * specified id, an ExceptionalResult is returned.
   */
  rpc getAnnotation(GetAnnotationRequest) returns (GetAnnotationResponse);

  /*
   * queryAnnotations(): Unary (non-streaming) Annotations query.
   *
   * Query Annotation records using structured search criteria.  Client sends a single
   * QueryAnnotationsRequest and receives a single QueryAnnotationsResponse.
   *
   * Results carry references, not embedded content: each returned Annotation has
   * dataSetIds and calculationsId, and neither dataset content nor calculations content is
   * included.  Retrieve dataset content with a single queryDataSets() call whose
   * IdCriterion lists the ids gathered across the returned annotations, and calculations
   * content with getCalculations() or getAnnotation().
   *
   * Pagination: limit sets the maximum number of records in a page; an unset or zero limit
   * means a server-configured default page size, NOT an unbounded result.  Clients must
   * follow nextPageToken to retrieve all matching records.  pageToken is an opaque
   * continuation token obtained from a previous response; a malformed token is rejected
   * with an ExceptionalResult.
   *
   * Ordering: results are ordered by id ascending.  The id is unique, which makes paging
   * stable, and is approximately insertion order.  Ordering is part of this method's
   * contract — paging is only well defined under a deterministic sort.
   *
   * The response may indicate rejection, an error in handling, or otherwise contains the
   * Annotations matching the query criteria.  A query matching no data returns an empty
   * result, not an ExceptionalResult.
   */
  rpc queryAnnotations(QueryAnnotationsRequest) returns (QueryAnnotationsResponse);

  /*
   * deleteAnnotation()
   *
   * Delete the Annotation with the specified id.  The Annotation's Calculations, if any,
   * are deleted with it — their lifecycle belongs to the owning Annotation.
   *
   * Unlike deleteDataSet(), this delete is NOT blocked by incoming references.  Other
   * Annotations listing this annotation's id in annotationIds, and
   * ColumnProvenance.derivedFrom links naming its calculations, are soft associations and
   * are permitted to dangle.  A soft link that resolves to nothing means the referenced
   * record was deleted, and readers must tolerate it.
   *
   * The response may indicate rejection, an error handling the request, or a
   * DeleteAnnotationResult confirming the id of the deleted record.
   */
  rpc deleteAnnotation(DeleteAnnotationRequest) returns (DeleteAnnotationResponse);

  /*
   * patchAnnotation()
   *
   * Partial update of an existing Annotation.  Allows individual fields (dataSetIds, name,
   * annotationIds, description, tags, attributes, calculations, modifiedBy) to be updated
   * without replacing the entire record, unlike the full-replace semantics of
   * saveAnnotation().
   *
   * NOT YET IMPLEMENTED — calling this method returns an error response.
   * Planned for a future release.  Field mask design is deferred.
   *
   * This method is defined now to reserve its name and message shapes as part
   * of the standard CRUD pattern for metadata APIs in this service.
   */
  rpc patchAnnotation(PatchAnnotationRequest) returns (PatchAnnotationResponse);


  //
  // ------------------- Calculations Retrieval ---------------------------
  //

  /*
   * getCalculations()
   *
   * Retrieve a single Calculations object by id, without loading the owning Annotation's
   * descriptive payload.  This is the click-through path: list annotations, pick one, then
   * fetch exactly its calculations using the calculationsId the listing returned.
   *
   * Obtain calculationsId from SaveAnnotationResult, from Annotation.calculationsId in
   * query or get results, or from a ColumnProvenance.CalculationsColumn provenance link.
   *
   * Calculations have no save, delete, or query method of their own, and the asymmetry is
   * deliberate: they are written and replaced through saveAnnotation(), their lifecycle
   * belongs to the owning Annotation (deleteAnnotation() removes them), and discovery goes
   * through queryAnnotations().  Only retrieval needs a standalone path, because a client
   * that already holds a calculationsId should not have to fetch an annotation to use it.
   *
   * The response may indicate rejection, an error handling the request, or a
   * GetCalculationsResult containing the matching record.  If no Calculations object
   * exists with the specified id, an ExceptionalResult is returned.
   */
  rpc getCalculations(GetCalculationsRequest) returns (GetCalculationsResponse);


  //
  // ------------------- Export ---------------------------
  //

  /*
   * exportData(): Export data to common file formats.
   *
   * This RPC is used by clients to export archived PV data and/or Annotation Calculations
   * to file.  Client sends a single ExportDataRequest specifying the data to be exported
   * and the desired output file format, and receives a single response.  The response may
   * indicate a problem handling the request, or otherwise contains details about the
   * exported file including the path and optional (if configured) URL for accessing the
   * file.
   *
   * Data to export is specified by any combination of a saved DataSet (dataSetId), inline
   * ad-hoc DataBlocks (dataBlocks), and Calculations (calculationsSpec).  At least one must
   * be supplied; a request specifying none is rejected.  See ExportDataRequest.
   *
   * Output format restriction: the tabular formats (CSV, XLSX) can only represent scalar
   * columns.  A DataSet or Calculations object containing array, image, or struct columns
   * can be exported to HDF5, but a request to export it as CSV or XLSX is rejected.
   */
  rpc exportData(ExportDataRequest) returns (ExportDataResponse);

  /*
   * savePvMetadata()
   *
   * Create or replace the metadata record for the specified PV.
   *
   * Full replace (upsert) semantics: if a record does not exist it is created;
   * if a record already exists, ALL fields (aliases, tags, attributes,
   * description, modifiedBy) are replaced with the request contents.
   * Callers must supply the complete desired state on every call — fields
   * omitted from the request are not preserved.  Use patchPvMetadata()
   * (future) for partial updates.
   *
   * The response may indicate rejection, an error handling the request, or
   * successful handling of the request.
   */
  rpc savePvMetadata(SavePvMetadataRequest) returns (SavePvMetadataResponse);

  /*
   * queryPvMetadata()
   *
   * Query PV metadata records using structured search criteria.
   *
   * Pagination: limit sets the maximum number of records in a page; an unset or zero limit
   * means a server-configured default page size, NOT an unbounded result.  Clients must
   * follow nextPageToken to retrieve all matching records.  pageToken is an opaque
   * continuation token obtained from a previous response; a malformed token is rejected
   * with an ExceptionalResult.
   *
   * Ordering: results are ordered by pvName ascending.  pvName is unique, which makes
   * paging stable.  Ordering is part of this method's contract — paging is only well
   * defined under a deterministic sort.
   *
   * The response may indicate rejection, an error handling the request, or
   * a PvMetadataResult containing the matching records and pagination token.
   */
  rpc queryPvMetadata(QueryPvMetadataRequest) returns (QueryPvMetadataResponse);

  /*
   * getPvMetadata()
   *
   * Retrieve a single PV metadata record by canonical PV name or alias.
   * Provided as a convenience over queryPvMetadata() for the common
   * single-record lookup case.
   *
   * The response may indicate rejection, an error handling the request, or
   * a GetPvMetadataResponse containing the matching record.  If no record
   * is found for the specified name or alias, an ExceptionalResult is returned.
   */
  rpc getPvMetadata(GetPvMetadataRequest) returns (GetPvMetadataResponse);

  /*
   * patchPvMetadata()
   *
   * Partial update of an existing PV metadata record.  Allows individual
   * fields (aliases, tags, attributes, description, modifiedBy) to be updated
   * without replacing the entire record, unlike the full-replace semantics
   * of savePvMetadata().
   *
   * NOT YET IMPLEMENTED — calling this method returns an error response.
   * Planned for a future release.  Field mask design is deferred.
   *
   * This method is defined now to reserve its name and message shapes as part
   * of the standard CRUD pattern for metadata APIs in this service.
   */
  rpc patchPvMetadata(PatchPvMetadataRequest) returns (PatchPvMetadataResponse);

  /*
   * deletePvMetadata()
   *
   * Delete the metadata record for the specified canonical PV name or alias.
   *
   * The response may indicate rejection, an error handling the request, or
   * a DeletePvMetadataResult confirming the name of the deleted record.
   */
  rpc deletePvMetadata(DeletePvMetadataRequest) returns (DeletePvMetadataResponse);

  /*
   * bulkSavePvMetadata()
   *
   * Bulk create or replace multiple PV metadata records in a single request.
   * Each record uses the same full-replace upsert semantics as savePvMetadata().
   * Intended for large initial imports or bulk synchronization use cases.
   *
   * NOT YET IMPLEMENTED — calling this method returns an error response.
   * Planned for a future release.
   *
   * This method is defined now to reserve its name and message shapes as part
   * of the standard bulk-write pattern for metadata APIs in this service.
   */
  rpc bulkSavePvMetadata(BulkSavePvMetadataRequest) returns (BulkSavePvMetadataResponse);


  //
  // ------------------- Configuration Definition CRUD ---------------------------
  //

  /*
   * saveConfiguration()
   *
   * Create or replace the metadata record for the specified machine configuration.
   *
   * Full replace (upsert) semantics: if a record does not exist it is created;
   * if a record already exists, ALL fields (category, description,
   * parentConfigurationName, tags, attributes, modifiedBy) are replaced with
   * the request contents.  Callers must supply the complete desired state on
   * every call — fields omitted from the request are not preserved.
   * Use patchConfiguration() (future) for partial updates.
   *
   * The response may indicate rejection, an error handling the request, or
   * successful handling of the request.
   */
  rpc saveConfiguration(SaveConfigurationRequest) returns (SaveConfigurationResponse);

  /*
   * getConfiguration()
   *
   * Retrieve a single Configuration record by configurationName.
   * Provided as a convenience over queryConfigurations() for the common
   * single-record lookup case.
   *
   * The response may indicate rejection, an error handling the request, or
   * a GetConfigurationResult containing the matching record.  If no record
   * is found, an ExceptionalResult is returned.
   */
  rpc getConfiguration(GetConfigurationRequest) returns (GetConfigurationResponse);

  /*
   * queryConfigurations()
   *
   * Query Configuration records using structured search criteria.
   *
   * Pagination: limit sets the maximum number of records in a page; an unset or zero limit
   * means a server-configured default page size, NOT an unbounded result.  Clients must
   * follow nextPageToken to retrieve all matching records.  pageToken is an opaque
   * continuation token obtained from a previous response; a malformed token is rejected
   * with an ExceptionalResult.
   *
   * Ordering: results are ordered by configurationName ascending.  configurationName is
   * unique, which makes paging stable.  Ordering is part of this method's contract —
   * paging is only well defined under a deterministic sort.
   *
   * The response may indicate rejection, an error handling the request, or
   * a QueryConfigurationsResult containing the matching records and pagination token.
   */
  rpc queryConfigurations(QueryConfigurationsRequest) returns (QueryConfigurationsResponse);

  /*
   * deleteConfiguration()
   *
   * Delete the Configuration record for the specified configurationName.
   * The request is rejected if ConfigurationActivation records exist for the
   * configuration; delete associated activations first.
   *
   * The response may indicate rejection, an error handling the request, or
   * a DeleteConfigurationResult confirming the name of the deleted record.
   */
  rpc deleteConfiguration(DeleteConfigurationRequest) returns (DeleteConfigurationResponse);

  /*
   * patchConfiguration()
   *
   * Partial update of an existing Configuration record.  Allows individual
   * fields to be updated without replacing the entire record, unlike the
   * full-replace semantics of saveConfiguration().
   *
   * NOT YET IMPLEMENTED — calling this method returns an error response.
   * Planned for a future release.
   *
   * This method is defined now to reserve its name and message shapes as part
   * of the standard CRUD pattern for metadata APIs in this service.
   */
  rpc patchConfiguration(PatchConfigurationRequest) returns (PatchConfigurationResponse);

  /*
   * bulkSaveConfiguration()
   *
   * Bulk create or replace multiple Configuration records in a single request.
   * Each record uses the same full-replace upsert semantics as saveConfiguration().
   * Intended for large initial imports or bulk synchronization use cases.
   *
   * NOT YET IMPLEMENTED — calling this method returns an error response.
   * Planned for a future release.
   *
   * This method is defined now to reserve its name and message shapes as part
   * of the standard bulk-write pattern for metadata APIs in this service.
   */
  rpc bulkSaveConfiguration(BulkSaveConfigurationRequest) returns (BulkSaveConfigurationResponse);


  //
  // ------------------- Configuration Activation CRUD ---------------------------
  //

  /*
   * saveConfigurationActivation()
   *
   * Create or replace an activation record indicating the time interval during
   * which a Configuration was active.
   *
   * Full replace (upsert) semantics: if a record does not exist it is created;
   * if a record already exists (matched by clientActivationId, or by composite
   * key configurationName + startTime if clientActivationId is absent), ALL
   * fields are replaced with the request contents.  Callers must supply the
   * complete desired state on every call — fields omitted from the request are
   * not preserved.  Use patchConfigurationActivation() (future) for partial updates.
   *
   * To close an open-ended activation, call saveConfigurationActivation() with
   * endTime set to the desired close time.
   *
   * The response may indicate rejection, an error handling the request, or
   * successful handling of the request.
   */
  rpc saveConfigurationActivation(SaveConfigurationActivationRequest) returns (SaveConfigurationActivationResponse);

  /*
   * getConfigurationActivation()
   *
   * Retrieve a single ConfigurationActivation record by clientActivationId or
   * composite key (configurationName + startTime).
   *
   * The response may indicate rejection, an error handling the request, or
   * a GetConfigurationActivationResult containing the matching record.  If no
   * record is found, an ExceptionalResult is returned.
   */
  rpc getConfigurationActivation(GetConfigurationActivationRequest) returns (GetConfigurationActivationResponse);

  /*
   * queryConfigurationActivations()
   *
   * Query ConfigurationActivation records using structured search criteria.
   *
   * Pagination: limit sets the maximum number of records in a page; an unset or zero limit
   * means a server-configured default page size, NOT an unbounded result.  Clients must
   * follow nextPageToken to retrieve all matching records.  pageToken is an opaque
   * continuation token obtained from a previous response; a malformed token is rejected
   * with an ExceptionalResult.
   *
   * Ordering: results are ordered by startTime ascending, then configurationName
   * ascending, then record id ascending.  startTime alone is not unique, and the
   * tiebreakers are what make paging stable across records sharing a start time.
   * Ordering is part of this method's contract — paging is only well defined under a
   * deterministic sort.
   *
   * The response may indicate rejection, an error handling the request, or
   * a QueryConfigurationActivationsResult containing the matching records and
   * pagination token.
   */
  rpc queryConfigurationActivations(QueryConfigurationActivationsRequest) returns (QueryConfigurationActivationsResponse);

  /*
   * deleteConfigurationActivation()
   *
   * Delete a ConfigurationActivation record by clientActivationId or composite
   * key (configurationName + startTime).
   *
   * The response may indicate rejection, an error handling the request, or
   * a DeleteConfigurationActivationResult confirming the ID of the deleted record.
   */
  rpc deleteConfigurationActivation(DeleteConfigurationActivationRequest) returns (DeleteConfigurationActivationResponse);

  /*
   * patchConfigurationActivation()
   *
   * Partial update of an existing ConfigurationActivation record.  Allows
   * individual fields to be updated without replacing the entire record, unlike
   * the full-replace semantics of saveConfigurationActivation().
   *
   * NOT YET IMPLEMENTED — calling this method returns an error response.
   * Planned for a future release.
   *
   * This method is defined now to reserve its name and message shapes as part
   * of the standard CRUD pattern for metadata APIs in this service.
   */
  rpc patchConfigurationActivation(PatchConfigurationActivationRequest) returns (PatchConfigurationActivationResponse);

  /*
   * bulkSaveConfigurationActivation()
   *
   * Bulk create or replace multiple ConfigurationActivation records in a single
   * request.  Each record uses the same full-replace upsert semantics as
   * saveConfigurationActivation().  Intended for bulk loading of activation
   * records from operational calendars.
   *
   * NOT YET IMPLEMENTED — calling this method returns an error response.
   * Planned for a future release.
   *
   * This method is defined now to reserve its name and message shapes as part
   * of the standard bulk-write pattern for metadata APIs in this service.
   */
  rpc bulkSaveConfigurationActivation(BulkSaveConfigurationActivationRequest) returns (BulkSaveConfigurationActivationResponse);


  //
  // ------------------- Active Configuration Query ---------------------------
  //

  /*
   * getActiveConfigurations()
   *
   * Returns all ConfigurationActivation records in effect at the specified
   * timestamp, i.e., records where:
   *   startTime <= timestamp AND (endTime is absent OR endTime > timestamp)
   *
   * timestamp is required.  Requests with an absent (zero-value) timestamp
   * are rejected with an ExceptionalResult.
   *
   * An empty result (no active configurations at the specified time) is
   * returned as a GetActiveConfigurationsResult with an empty list, not
   * an ExceptionalResult.
   */
  rpc getActiveConfigurations(GetActiveConfigurationsRequest) returns (GetActiveConfigurationsResponse);


  //
  // ------------------- Sample Status ---------------------------
  //

  /*
   * saveSampleStatuses()
   *
   * Batch upsert of sample statuses, assigning status codes to individual PV samples at
   * specific timestamps.  The request contains one or more SampleStatusFrames, each carrying a
   * (domain, layer), a DataTimestamps time axis, and one SampleStatusColumn per PV.
   *
   * Upsert semantics are per individual sample status, keyed by (pvName, timestamp, domain,
   * layer): an entry REPLACES any existing status with the same key IN FULL — including the
   * optional confidence and reasons — and creates a new status otherwise.  Statuses at other
   * timestamps are unaffected — to cleanly re-label a time range (e.g., after re-running an ML
   * model whose output timestamps changed), first call deleteSampleStatuses() for the range,
   * then save.
   *
   * Frames are processed in request order.  If the same identity key appears in more than one
   * frame of a request, the later frame's status wins (consistent with upsert across requests:
   * last writer wins), and savedCount counts each write.
   *
   * The request is validated and rejected as a whole (no partial save on rejection).  If an
   * error is encountered while writing a valid request, an ExceptionalResult with
   * RESULT_STATUS_ERROR is returned and some frames may have been persisted.
   *
   * The response may indicate rejection, an error handling the request, or successful
   * handling of the request.
   */
  rpc saveSampleStatuses(SaveSampleStatusesRequest) returns (SaveSampleStatusesResponse);

  /*
   * querySampleStatuses(): Unary sample status query.
   *
   * Query sample statuses over a time range, optionally filtered by PV name, domain, and
   * layer (an empty pvNames list matches all PVs — e.g., to enumerate which PVs a layer has
   * labeled).  Returns one page of SampleStatusBucket objects; additional pages are retrieved
   * by resubmitting the request with the nextPageToken from the previous response as
   * pageToken.  A malformed pageToken is rejected with an ExceptionalResult.
   *
   * Ordering: results are ordered by pvName ascending, then domain, then layer, then
   * bucket start time.  Ordering is part of this method's contract — paging is only well
   * defined under a deterministic sort.
   *
   * Bucket selection follows the TimeRange overlap test, and boundary buckets are returned
   * WHOLE (not trimmed) — matching DpQueryService.queryBuckets() — so a returned bucket may
   * contain individual statuses outside [beginTime, endTime).
   *
   * A query matching no data returns an empty result, not an ExceptionalResult.
   */
  rpc querySampleStatuses(QuerySampleStatusesRequest) returns (QuerySampleStatusesResponse);

  /*
   * querySampleStatusesStream(): Server-streaming sample status query.
   *
   * Streams QuerySampleStatusesResponse messages until the result is exhausted, the client
   * cancels, or an error occurs.  Paging semantics match DpQueryService.queryBucketsStream():
   * limit controls the chunk size of each streamed response; streaming is fire-and-consume —
   * the server streams to completion and does not emit continuation tokens (nextPageToken is
   * empty on every streamed message); pageToken must be empty (a non-empty token is rejected
   * with an ExceptionalResult).  Use unary querySampleStatuses() when resumable paging is
   * required.
   */
  rpc querySampleStatusesStream(QuerySampleStatusesRequest) returns (stream QuerySampleStatusesResponse);

  /*
   * deleteSampleStatuses()
   *
   * Delete sample statuses within the half-open time range [beginTime, endTime), for a single
   * required (domain, layer).  pvNames restricts the delete to the listed PVs; an empty
   * pvNames list is a deliberate wildcard deleting the (domain, layer)'s statuses for ALL PVs
   * in the range.  Intended for cleanly re-labeling a range (delete then save) and for
   * retiring an obsolete producer's statuses (wide time range + empty pvNames).
   *
   * Unlike query — which returns boundary buckets whole — deletion is EXACT at the sample
   * axis: only statuses whose timestamps fall within the range are removed; the server splits
   * or rewrites boundary storage buckets as needed.
   *
   * domain and layer are required, scoping each delete to a single producer stream.
   *
   * A delete matching no statuses is a successful result with deletedCount = 0, not an
   * ExceptionalResult.
   */
  rpc deleteSampleStatuses(DeleteSampleStatusesRequest) returns (DeleteSampleStatusesResponse);

  /*
   * saveSampleStatusDomain()
   *
   * Create or replace a sample status domain registry record, documenting the status code
   * mappings (code -> label / description) for a domain so that consumers can interpret status
   * codes without out-of-band knowledge.
   *
   * NOT YET IMPLEMENTED — calling this method returns an error response.
   * Planned for a future release.
   *
   * This method is defined now to reserve its name and message shapes as part
   * of the standard CRUD pattern for metadata APIs in this service.
   */
  rpc saveSampleStatusDomain(SaveSampleStatusDomainRequest) returns (SaveSampleStatusDomainResponse);

  /*
   * querySampleStatusDomains()
   *
   * Query sample status domain registry records.
   *
   * NOT YET IMPLEMENTED — calling this method returns an error response.
   * Planned for a future release.
   *
   * This method is defined now to reserve its name and message shapes as part
   * of the standard CRUD pattern for metadata APIs in this service.
   */
  rpc querySampleStatusDomains(QuerySampleStatusDomainsRequest) returns (QuerySampleStatusDomainsResponse);
}


//
// ------------------- DataSet / DataBlock Model ---------------------------
//

/*
 * DataSet
 *
 * Mechanism for identifying a set of data within the archive, used to support other features such as adding
 * annotations to data sets or exporting data sets.
 *
 * A DataSet specifies archived data across multiple DataBlocks.  Each DataBlock specifies a time range and list of
 * data sources (columns/PVs).
 *
 * The primary key is an opaque server-generated id.  DataSet names are not unique, so unlike the natural-key
 * metadata APIs in this service (PV metadata, Configuration), the id is the only way to address a specific
 * record in getDataSet(), deleteDataSet(), patchDataSet(), and Annotation.dataSetIds.
 */
message DataSet {
  string id = 1; // server-generated primary key
  string name = 2; // required name; not unique
  string ownerId = 3; // required owner
  string description = 4; // optional textual description
  repeated DataBlock dataBlocks = 5; // required list of DataBlocks identifying data to include in DataSet.
  repeated string tags = 6; // optional list of keywords / tags for cataloging DataSet
  repeated dp.service.common.Attribute attributes = 7; // optional list of key/value attribute pairs for cataloging DataSet
  dp.service.common.Timestamp createdTime = 8; // server-set: time the record was created
  dp.service.common.Timestamp updatedTime = 9; // server-set: time of most recent save affecting the record
  string modifiedBy = 10; // optional actor / user / service identity from most recent save
}

message DataBlock {
  dp.service.common.Timestamp beginTime = 1; // Required, specifies beginning of time range for basis set.
  dp.service.common.Timestamp endTime = 2; // Required, specifies end of time range for basis set.
  repeated string pvNames = 3; // Required, contains list of data source names for basis set.
}


//
// ------------------- DataSet Save Request/Response ---------------------------
//

/*
 * SaveDataSetRequest
 *
 * Encapsulates the details for creating or replacing a DataSet.
 *
 * Full replace (upsert) semantics:
 *   - If id is empty, a new DataSet is created and the server generates its id.
 *   - If id is supplied, name / ownerId / description / dataBlocks / tags / attributes /
 *     modifiedBy are ALL replaced with the values in this request.
 *
 * WARNING: Fields omitted from the request are NOT preserved on update.  Callers must
 * supply the complete desired state on every save.  patchDataSet() (future placeholder)
 * will provide partial-update semantics.
 *
 * Note: the audit timestamps createdTime and updatedTime are server-set and are not
 * accepted as input; they are returned in getDataSet() and queryDataSets() responses only.
 */
message SaveDataSetRequest {
  string id = 1; // optional id of existing DataSet to replace; empty = create a new DataSet
  string name = 2; // required name; not unique
  string ownerId = 3; // required owner
  string description = 4; // optional textual description
  repeated DataBlock dataBlocks = 5; // required list of DataBlocks identifying data to include in DataSet
  repeated string tags = 6; // optional list of keywords / tags for cataloging DataSet
  repeated dp.service.common.Attribute attributes = 7; // optional list of key/value attribute pairs for cataloging DataSet
  string modifiedBy = 8; // optional actor / user / service identity performing this save
}

/*
 * SaveDataSetResponse
 *
 * Contains the result of a saveDataSet() request.  Payload is an ExceptionalResult if the
 * request is rejected or an error is encountered by the handler, otherwise contains a
 * SaveDataSetResult.
 */
message SaveDataSetResponse {

  dp.service.common.Timestamp responseTime = 1; // Indicates time response was generated.

  // result: Contains query result payload with either ExceptionalResult or SuccessfulResult as described above.
  oneof result {
    dp.service.common.ExceptionalResult exceptionalResult = 10;
    SaveDataSetResult saveDataSetResult = 11;
  }

  /*
   * SaveDataSetResult
   *
   * Contains the results of a successful request to create or replace a DataSet, with the id of the
   * corresponding new or updated DataSet.
   */
  message SaveDataSetResult {
    string dataSetId = 1;
  }
}


